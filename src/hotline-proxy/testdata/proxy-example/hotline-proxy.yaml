# Full example config for the Hotline proxy (first version).
# It points to the two specs in ./specs. See README.md here for a sample call.

listen:
  proxy: ":8080"                  # forward proxy, Host header, vendor URL in path
  admin: ":8081"                  # health checks and admin endpoints only

exporters:                        # one or more; each gets the same data
  - otlp:
      endpoint: hotline-control-plane.hotline:4317    # the control plane's ingestion
  - otlp:
      endpoint: otel-collector.observability:4317     # the customer's own collector
      temporality: delta
  # - otlp:                      # a hosted collector over HTTP, with TLS and a login token
  #     protocol: http/protobuf   # grpc (default) or http/protobuf
  #     endpoint: https://otel.example.com:4318
  #     headers:
  #       Authorization: { file: /etc/hotline/otlp/token }

telemetry:                        # the proxy's own health data, kept separate
  otlp:
    endpoint: otel-collector.observability:4317

apis:                             # each vendor api once; its spec is read once and shared
  talon-one:
    hosts: [api.talon.one]
    spec: ./specs/talon-one.openapi.yaml   # its x-hotline-redact marks say what to keep
    vendorTimeout: 10s
    # allowInternalIPs: false     # default false; true lets this api's hosts be on internal IPs
  stripe:
    hosts: [api.stripe.com]
    spec: ./specs/stripe.openapi.yaml      # its x-hotline-redact marks say what to keep
    vendorTimeout: 30s

integrations:
  - id: talon-shop-a              # shop A's use of Talon.One and Stripe
    fingerprintKey: { file: /etc/hotline/keys/talon-shop-a }   # secret key that signs the records, from a mounted Kubernetes Secret
    apis: [talon-one, stripe]     # names from the apis section

  - id: talon-shop-b              # same Talon.One API, different shop
    fingerprintKey: { env: HOTLINE_KEY_TALON_SHOP_B }   # also allowed; a file is preferred
    traceFormat: b3               # how the app sends its trace id: w3c (default), b3, xray or jaeger
    traceForward: false           # default false; true sends the proxy's trace id and span id on to the vendor
    apis:
      - { api: talon-one, vendorTimeout: 5s }   # an integration may change only vendorTimeout

  - id: not-passed                # calls without a known ID; no apis, these apply to any host
    tlsOrigination: true          # built-in default is false
