# A small vendor spec for the checks scenarios: every part of a call has
# something to check.
openapi: 3.1.0
info: { title: Shop, version: "1" }
servers:
  - url: https://api.shop.test
security:
  - key: []
paths:
  /orders:
    get:
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: tag, in: query, schema: { type: array, items: { type: string, enum: [new, paid] } } }
        - name: filter
          in: query
          style: deepObject
          schema:
            type: object
            properties:
              status: { type: string, enum: [open, closed] }
        - { name: session, in: cookie, schema: { type: integer } }
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderList" }
        "400":
          description: A bad call
    post:
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Order" }
      responses:
        "201":
          description: Created
  /orders/{orderId}:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      responses:
        "200":
          description: One order
          headers:
            X-Request-Id:
              required: true
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        default:
          description: Any other answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /payments:
    post:
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [amount, currency]
              properties:
                amount: { type: integer }
                currency: { type: string }
                metadata: { type: object, additionalProperties: { type: string } }
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      price: { type: string }
                      quantity: { type: integer }
      responses:
        "200":
          description: Paid
  /files/{name}:
    put:
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/pdf: {}
      responses:
        "200":
          description: Stored
  /formats:
    get:
      parameters:
        - { name: date-time, in: query, schema: { type: string, format: date-time } }
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: email, in: query, schema: { type: string, format: email } }
        - { name: uuid, in: query, schema: { type: string, format: uuid } }
        - { name: uri, in: query, schema: { type: string, format: uri } }
        - { name: ipv4, in: query, schema: { type: string, format: ipv4 } }
        - { name: ipv6, in: query, schema: { type: string, format: ipv6 } }
        - { name: int32, in: query, schema: { type: integer, format: int32 } }
        - { name: int64, in: query, schema: { type: integer, format: int64 } }
        - { name: hostname, in: query, schema: { type: string, format: hostname } }
        - { name: stripe-id, in: query, schema: { type: string, format: stripe-id } }
      responses:
        "200":
          description: Fine
  /public:
    get:
      security: []
      responses:
        "200":
          description: Open to all
components:
  schemas:
    Order:
      type: object
      required: [item, quantity]
      additionalProperties: false
      properties:
        item: { type: string }
        quantity: { type: integer, minimum: 1 }
        lines:
          type: array
          items: { $ref: "#/components/schemas/Line" }
    Line:
      type: object
      required: [sku]
      properties:
        sku: { type: string }
    OrderList:
      type: object
      required: [orders]
      properties:
        orders: { type: array, items: { $ref: "#/components/schemas/Order" } }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
  securitySchemes:
    key:
      type: http
      scheme: bearer
