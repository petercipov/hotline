# The payment-qr function on the shared Lambda spec (specs/aws/lambda/2015-03-31.openapi.yaml):
# the invoices worker gives it an order and gets back the payment text a bank
# app reads from the QR code on the invoice. The SDK sends the input as
# application/octet-stream, so the overlay says it is JSON.
overlay: 1.1.0
info:
  title: Payment-qr function
  version: "1"
actions:
  # Only this function, and its name is safe to keep in url.full.
  - target: $.paths['/2015-03-31/functions/{FunctionName}/invocations'].post.parameters[?@.name == 'FunctionName']
    update:
      schema: { const: payment-qr }
      x-hotline-redact: false
  - target: $.paths['/2015-03-31/functions/{FunctionName}/invocations'].post.requestBody.content
    update:
      application/octet-stream:
        x-hotline-body: json
        schema:
          type: object
          additionalProperties: false
          required: [orderId, amount, currency]
          properties:
            orderId: { type: string, pattern: '^[A-Z]-[0-9]+$' }
            amount: { type: string, pattern: '^[0-9]+\.[0-9]{2}$' }
            currency: { type: string, enum: [EUR, CZK, USD] }
  # A function that fails still answers 200, with X-Amz-Function-Error and
  # an error body, which then misses qrText and is reported.
  - target: $.paths['/2015-03-31/functions/{FunctionName}/invocations'].post.responses['200'].content
    update:
      application/json:
        schema:
          type: object
          required: [qrText]
          properties:
            qrText: { type: string, minLength: 1 }
  - target: $.paths['/2015-03-31/functions/{FunctionName}/invocations'].post.responses['200'].headers['X-Amz-Function-Error']
    update:
      x-hotline-redact: false
