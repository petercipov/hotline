# The payment key on the shared Secrets Manager spec (specs/aws/secrets-manager/2017-10-17.openapi.yaml):
# checkout reads one secret. Its value is in the reply body, which is never
# recorded.
overlay: 1.1.0
info:
  title: Payment key
  version: "1"
actions:
  - target: $.components.schemas.GetSecretValueRequest.properties.SecretId
    update:
      const: shop/payment-key
