                    description: The date and time the state machine was updated.
            required:
                - updateDate
            type: object
        ValidateStateMachineDefinitionCode:
            type: string
        ValidateStateMachineDefinitionDiagnostic:
            description: Describes potential issues found during state machine validation. Rather than raise an exception, validation will return a list of diagnostic elements containing diagnostic information. The ValidateStateMachineDefinitionlAPI might add new diagnostics in the future, adjust diagnostic codes, or change the message wording. Your automated processes should only rely on the value of the result field value (OK, FAIL). Do not rely on the exact order, count, or wording of diagnostic messages. List of warning codes NO_DOLLAR No .$ on a field that appears to be a JSONPath or Intrinsic Function. NO_PATH Field value looks like a path, but field name does not end with 'Path'. PASS_RESULT_IS_STATIC Attempt to use a path in the result of a pass state. List of error codes INVALID_JSON_DESCRIPTION JSON syntax problem found. MISSING_DESCRIPTION Received a null or empty workflow input. SCHEMA_VALIDATION_FAILED Schema validation reported errors. INVALID_RESOURCE The value of a Task-state resource field is invalid. MISSING_END_STATE The workflow does not have a terminal state. DUPLICATE_STATE_NAME The same state name appears more than once. INVALID_STATE_NAME The state name does not follow the naming convention. STATE_MACHINE_NAME_EMPTY The state machine name has not been specified. STATE_MACHINE_NAME_INVALID The state machine name does not follow the naming convention. STATE_MACHINE_NAME_TOO_LONG The state name exceeds the allowed length. STATE_MACHINE_NAME_ALREADY_EXISTS The state name already exists. DUPLICATE_LABEL_NAME A label name appears more than once. INVALID_LABEL_NAME You have provided an invalid label name. MISSING_TRANSITION_TARGET The value of "Next" field doesn't match a known state name. TOO_DEEPLY_NESTED The states are too deeply nested.
            properties:
                code:
                    $ref: '#/components/schemas/ValidateStateMachineDefinitionCode'
                    description: Identifying code for the diagnostic.
                location:
                    $ref: '#/components/schemas/ValidateStateMachineDefinitionLocation'
                    description: 'Location of the issue in the state machine, if available. For errors specific to a field, the location could be in the format: /States/ / , for example: /States/FailState/ErrorPath .'
                message:
                    $ref: '#/components/schemas/ValidateStateMachineDefinitionMessage'
                    description: Message describing the diagnostic condition.
                severity:
                    $ref: '#/components/schemas/ValidateStateMachineDefinitionSeverity'
                    description: A value of ERROR means that you cannot create or update a state machine with this definition. WARNING level diagnostics alert you to potential issues, but they will not prevent you from creating or updating your state machine.
            required:
                - code
                - message
                - severity
            type: object
        ValidateStateMachineDefinitionDiagnosticList:
            items:
                $ref: '#/components/schemas/ValidateStateMachineDefinitionDiagnostic'
            type: array
        ValidateStateMachineDefinitionInput:
            properties:
                definition:
                    $ref: '#/components/schemas/Definition'
                    description: The Amazon States Language definition of the state machine. For more information, see Amazon States Language (ASL).
                maxResults:
                    $ref: '#/components/schemas/ValidateStateMachineDefinitionMaxResult'
                    description: The maximum number of diagnostics that are returned per call. The default and maximum value is 100. Setting the value to 0 will also use the default of 100. If the number of diagnostics returned in the response exceeds maxResults , the value of the truncated field in the response will be set to true .
                severity:
                    $ref: '#/components/schemas/ValidateStateMachineDefinitionSeverity'
                    description: Minimum level of diagnostics to return. ERROR returns only ERROR diagnostics, whereas WARNING returns both WARNING and ERROR diagnostics. The default is ERROR .
                type:
                    $ref: '#/components/schemas/StateMachineType'
                    description: The target type of state machine for this definition. The default is STANDARD .
            required:
                - definition
            type: object
        ValidateStateMachineDefinitionLocation:
            type: string
        ValidateStateMachineDefinitionMaxResult:
            format: int32
            maximum: 100
            minimum: 0
            type: integer
        ValidateStateMachineDefinitionMessage:
            type: string
        ValidateStateMachineDefinitionOutput:
            properties:
                diagnostics:
                    $ref: '#/components/schemas/ValidateStateMachineDefinitionDiagnosticList'
                    description: An array of diagnostic errors and warnings found during validation of the state machine definition. Since warnings do not prevent deploying your workflow definition, the result value could be OK even when warning diagnostics are present in the response.
                result:
                    $ref: '#/components/schemas/ValidateStateMachineDefinitionResultCode'
                    description: The result value will be OK when no syntax errors are found, or FAIL if the workflow definition does not pass verification.
                truncated:
                    $ref: '#/components/schemas/ValidateStateMachineDefinitionTruncated'
                    description: The result value will be true if the number of diagnostics found in the workflow definition exceeds maxResults . When all diagnostics results are returned, the value will be false .
            required:
                - diagnostics
                - result
            type: object
        ValidateStateMachineDefinitionResultCode:
            enum:
                - FAIL
                - OK
            type: string
        ValidateStateMachineDefinitionSeverity:
            enum:
                - ERROR
                - WARNING
            type: string
        ValidateStateMachineDefinitionTruncated:
            type: boolean
