                loggingConfiguration:
                    $ref: '#/components/schemas/LoggingConfiguration'
                name:
                    $ref: '#/components/schemas/Name'
                    description: 'The name of the state machine. A name must not contain: white space brackets { } [ ] wildcard characters ? * special characters " # % \ ^ | ~ ` $ & , ; : / control characters ( U+0000-001F , U+007F-009F , U+FFFE-FFFF ) surrogates ( U+D800-DFFF ) invalid characters ( U+10FFFF ) To enable logging with CloudWatch Logs, the name should only contain 0-9, A-Z, a-z, - and _.'
                revisionId:
                    $ref: '#/components/schemas/RevisionId'
                    description: The revision identifier for the state machine. Use the revisionId parameter to compare between versions of a state machine configuration used for executions without performing a diff of the properties, such as definition and roleArn .
                roleArn:
                    $ref: '#/components/schemas/Arn'
                    description: The Amazon Resource Name (ARN) of the IAM role used when creating this state machine. (The IAM role maintains security by granting Step Functions access to Amazon Web Services resources.)
                stateMachineArn:
                    $ref: '#/components/schemas/Arn'
                    description: The Amazon Resource Name (ARN) that identifies the state machine. If you specified a state machine version ARN in your request, the API returns the version ARN. The version ARN is a combination of state machine ARN and the version number separated by a colon (:). For example, stateMachineARN:1 .
                status:
                    $ref: '#/components/schemas/StateMachineStatus'
