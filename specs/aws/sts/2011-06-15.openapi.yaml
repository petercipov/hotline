    /#Action=GetWebIdentityToken:
        post:
            description: Returns a signed JSON Web Token (JWT) that represents the calling Amazon Web Services identity. The returned JWT can be used to authenticate with external services that support OIDC discovery. The token is signed by Amazon Web Services STS and can be publicly verified using the verification keys published at the issuer's JWKS endpoint. The GetWebIdentityToken API is not available on the STS Global endpoint.
            operationId: GetWebIdentityToken
            requestBody:
