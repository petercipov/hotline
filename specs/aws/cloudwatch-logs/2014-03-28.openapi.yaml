                    description: Filters the results to include only events from log streams that have names starting with this prefix. If you specify a value for both logStreamNamePrefix and logStreamNames , the action returns an InvalidParameterException error.
                logStreamNames:
                    $ref: '#/components/schemas/InputLogStreamNames'
                    description: Filters the results to only logs from the log streams in this list. If you specify a value for both logStreamNames and logStreamNamePrefix , the action returns an InvalidParameterException error.
                nextToken:
                    $ref: '#/components/schemas/NextToken'
                    description: The token for the next set of events to return. (You received this token from a previous call.)
                startFromHead:
                    $ref: '#/components/schemas/StartFromHead'
                    description: If the value is true, the earliest log events are returned first. If the value is false, the latest log events are returned first. The default value is true. The startFromHead parameter sets the sort direction on the first request. On subsequent requests, the nextToken determines the sort direction. To continue paginating in the same direction, provide the returned nextToken . If you provide both nextToken and startFromHead , the direction of the nextToken is used. Setting startFromHead to false is supported only when startTime is on or after Jan 1, 2024 00:00:00 UTC . A request with startFromHead set to false and a startTime before this date returns an InvalidParameterException .
                startTime:
                    $ref: '#/components/schemas/Timestamp'
                    description: The start of the time range, expressed as the number of milliseconds after Jan 1, 1970 00:00:00 UTC . Events with a timestamp before this time are not returned. Set startTime explicitly to reduce the chances of empty pages in the response.
                unmask:
