                logStreamName:
                    $ref: '#/components/schemas/LogStreamName'
                    description: The name of the log stream.
                storedBytes:
                    $ref: '#/components/schemas/StoredBytes'
                    description: 'The number of bytes stored. Important: As of June 17, 2019, this parameter is no longer supported for log streams, and is always reported as zero. This change applies only to log streams. The storedBytes parameter for log groups is not affected.'
                uploadSequenceToken:
                    $ref: '#/components/schemas/SequenceToken'
