                    description: The list of allowed values for the configuration. Empty for free-form configuration.
                valueType:
                    $ref: '#/components/schemas/DeliverySourceConfigurationSchemaValueType'
                    description: The data type of the configuration value. Valid values are string , boolean , int , double , and long .
            required:
                - defaultValue
                - keyName
                - valueType
            type: object
        DeliverySourceConfigurationSchemaField:
            maxLength: 256
            minLength: 1
            type: string
        DeliverySourceConfigurationSchemaValueType:
            enum:
                - boolean
                - double
                - int
                - long
                - string
            type: string
        DeliverySourceConfigurationSchemas:
            items:
                $ref: '#/components/schemas/DeliverySourceConfigurationSchema'
            type: array
        DeliverySourceConfigurationSupportedValues:
            items:
                $ref: '#/components/schemas/DeliverySourceConfigurationSchemaField'
