                  schema:
                    type: boolean
                - in: header
                  name: x-amz-object-ownership
                  schema:
                    type: string
            requestBody:
                content:
                    application/xml:
                        schema:
                            $ref: '#/components/schemas/CreateBucketConfiguration'
                            xml:
                                name: CreateBucketConfiguration
                        x-hotline-body: xml
            responses:
