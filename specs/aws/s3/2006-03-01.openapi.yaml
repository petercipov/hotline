        ScanRange:
            description: Specifies the byte range of the object to get the records from. A record is processed when its first byte is contained by the range. This parameter is optional, but when specified, it must not be empty. See RFC 2616, Section 14.35.1 about how to specify the start and end of the range.
            properties:
                End:
                    $ref: '#/components/schemas/End'
                    description: 'Specifies the end of the byte range. This parameter is optional. Valid values: non-negative integers. The default value is one less than the size of the object being queried. If only the End parameter is supplied, it is interpreted to mean scan the last N bytes of the file. For example, 50 means scan the last 50 bytes.'
                Start:
                    $ref: '#/components/schemas/Start'
                    description: 'Specifies the start of the byte range. This parameter is optional. Valid values: non-negative integers. The default value is 0. If only start is supplied, it means scan from that point to the end of the file. For example, 50 means scan from byte 50 until the end of the file.'
            type: object
        SelectObjectContentRequest:
            properties:
                Expression:
                    $ref: '#/components/schemas/Expression'
                    description: The expression that is used to query the object.
                ExpressionType:
                    $ref: '#/components/schemas/ExpressionType'
                    description: The type of the provided expression (for example, SQL).
                InputSerialization:
                    $ref: '#/components/schemas/InputSerialization'
                    description: Describes the format of the data in the object that is being queried.
                OutputSerialization:
                    $ref: '#/components/schemas/OutputSerialization'
                    description: Describes the format of the data that you want Amazon S3 to return in response.
                RequestProgress:
                    $ref: '#/components/schemas/RequestProgress'
                    description: Specifies if periodic request progress information should be enabled.
                ScanRange:
                    $ref: '#/components/schemas/ScanRange'
                    description: 'Specifies the byte range of the object to get the records from. A record is processed when its first byte is contained by the range. This parameter is optional, but when specified, it must not be empty. See RFC 2616, Section 14.35.1 about how to specify the start and end of the range. ScanRange may be used in the following ways: 50 100 - process only the records starting between the bytes 50 and 100 (inclusive, counting from zero) 50 - process only the records starting after the byte 50 50 - process only the records within the last 50 bytes of the file.'
            required:
