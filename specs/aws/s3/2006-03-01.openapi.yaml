                    description: Size in bytes of the object
                StorageClass:
                    $ref: '#/components/schemas/ObjectStorageClass'
                    description: The class of storage used to store the object. Directory buckets - Directory buckets only support EXPRESS_ONEZONE (the S3 Express One Zone storage class) in Availability Zones and ONEZONE_IA (the S3 One Zone-Infrequent Access storage class) in Dedicated Local Zones.
