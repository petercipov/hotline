                - InputSerialization
                - OutputSerialization
            type: object
            xml:
                name: SelectObjectContentRequest
        SelectParameters:
            description: Amazon S3 Select is no longer available to new customers. Existing customers of Amazon S3 Select can continue to use the feature as usual. Learn more Describes the parameters for Select job types. Learn How to optimize querying your data in Amazon S3 using Amazon Athena , S3 Object Lambda , or client-side filtering.
            properties:
