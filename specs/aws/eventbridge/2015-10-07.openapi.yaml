components:
    schemas:
        AccountId:
            maxLength: 12
            minLength: 12
            pattern: ^\d{12}$
            type: string
        Action:
            maxLength: 64
            minLength: 1
            pattern: ^events:[a-zA-Z]+$
            type: string
        ActivateEventSourceRequest:
            properties:
                Name:
                    $ref: '#/components/schemas/EventSourceName'
                    description: The name of the partner event source to activate.
            required:
                - Name
            type: object
        ApiDestination:
            description: Contains details about an API destination.
            properties:
                ApiDestinationArn:
                    $ref: '#/components/schemas/ApiDestinationArn'
                    description: The ARN of the API destination.
                ApiDestinationState:
                    $ref: '#/components/schemas/ApiDestinationState'
                    description: The state of the API destination.
                ConnectionArn:
                    $ref: '#/components/schemas/ConnectionArn'
                    description: The ARN of the connection specified for the API destination.
                CreationTime:
                    $ref: '#/components/schemas/Timestamp'
                    description: A time stamp for the time that the API destination was created.
                HttpMethod:
                    $ref: '#/components/schemas/ApiDestinationHttpMethod'
                    description: The method to use to connect to the HTTP endpoint.
                InvocationEndpoint:
                    $ref: '#/components/schemas/HttpsEndpoint'
                    description: The URL to the endpoint for the API destination.
                InvocationRateLimitPerSecond:
                    $ref: '#/components/schemas/ApiDestinationInvocationRateLimitPerSecond'
                    description: The maximum number of invocations per second to send to the HTTP endpoint.
                LastModifiedTime:
                    $ref: '#/components/schemas/Timestamp'
                    description: A time stamp for the time that the API destination was last modified.
                Name:
                    $ref: '#/components/schemas/ApiDestinationName'
                    description: The name of the API destination.
            type: object
        ApiDestinationArn:
            maxLength: 1600
            minLength: 1
            pattern: ^arn:aws([a-z]|\-)*:events:([a-z]|\d|\-)*:([0-9]{12})?:api-destination\/[\.\-_A-Za-z0-9]+\/[\-A-Za-z0-9]+$
            type: string
        ApiDestinationDescription:
            maxLength: 512
            minLength: 0
            pattern: .*
            type: string
        ApiDestinationHttpMethod:
            enum:
                - DELETE
                - GET
                - HEAD
                - OPTIONS
                - PATCH
                - POST
                - PUT
            type: string
        ApiDestinationInvocationRateLimitPerSecond:
            format: int32
            minimum: 1
            type: integer
        ApiDestinationName:
            maxLength: 64
            minLength: 1
            pattern: ^[\.\-_A-Za-z0-9]+$
            type: string
        ApiDestinationResponseList:
            items:
                $ref: '#/components/schemas/ApiDestination'
            type: array
        ApiDestinationState:
            enum:
                - ACTIVE
                - INACTIVE
            type: string
        AppSyncParameters:
            description: Contains the GraphQL operation to be parsed and executed, if the event target is an AppSync API.
            properties:
                GraphQLOperation:
                    $ref: '#/components/schemas/GraphQLOperation'
                    description: The GraphQL operation; that is, the query, mutation, or subscription to be parsed and executed by the GraphQL service. For more information, see Operations in the AppSync User Guide .
            type: object
        Archive:
            description: An Archive object that contains details about an archive.
            properties:
                ArchiveName:
                    $ref: '#/components/schemas/ArchiveName'
                    description: The name of the archive.
                CreationTime:
                    $ref: '#/components/schemas/Timestamp'
                    description: The time stamp for the time that the archive was created.
                EventCount:
                    $ref: '#/components/schemas/Long'
                    description: The number of events in the archive.
                EventSourceArn:
                    $ref: '#/components/schemas/EventBusArn'
                    description: The ARN of the event bus associated with the archive. Only events from this event bus are sent to the archive.
                RetentionDays:
                    $ref: '#/components/schemas/RetentionDays'
                    description: The number of days to retain events in the archive before they are deleted.
                SizeBytes:
                    $ref: '#/components/schemas/Long'
                    description: The size of the archive, in bytes.
                State:
                    $ref: '#/components/schemas/ArchiveState'
                    description: The current state of the archive.
                StateReason:
                    $ref: '#/components/schemas/ArchiveStateReason'
                    description: A description for the reason that the archive is in the current state.
            type: object
        ArchiveArn:
            maxLength: 1600
            minLength: 1
            pattern: ^arn:aws([a-z]|\-)*:events:([a-z]|\d|\-)*:([0-9]{12})?:.+\/.+$
            type: string
        ArchiveDescription:
            maxLength: 512
            minLength: 0
            pattern: .*
            type: string
        ArchiveName:
            maxLength: 48
            minLength: 1
            pattern: ^[\.\-_A-Za-z0-9]+$
            type: string
        ArchiveResponseList:
            items:
                $ref: '#/components/schemas/Archive'
            type: array
        ArchiveState:
            enum:
                - CREATE_FAILED
                - CREATING
                - DISABLED
                - ENABLED
                - UPDATE_FAILED
                - UPDATING
            type: string
        ArchiveStateReason:
            maxLength: 512
            minLength: 0
            pattern: .*
            type: string
        Arn:
            maxLength: 1600
            minLength: 1
            type: string
        AssignPublicIp:
            enum:
                - DISABLED
                - ENABLED
            type: string
        AuthHeaderParameters:
            maxLength: 512
            minLength: 1
            pattern: ^[ \t]*[^\x00-\x1F:\x7F]+([ \t]+[^\x00-\x1F:\x7F]+)*[ \t]*$
            type: string
        AuthHeaderParametersSensitive:
            maxLength: 512
            minLength: 1
            pattern: ^[ \t]*[^\x00-\x1F:\x7F]+([ \t]+[^\x00-\x1F:\x7F]+)*[ \t]*$
            type: string
        AwsJsonError:
            description: 'The body of every AWS JSON error reply: __type names the error.'
            properties:
                __type:
                    type: string
                Message:
                    type: string
                message:
                    type: string
            required:
                - __type
            type: object
        AwsVpcConfiguration:
            description: This structure specifies the VPC subnets and security groups for the task, and whether a public IP address is to be used. This structure is relevant only for ECS tasks that use the awsvpc network mode.
            properties:
                AssignPublicIp:
                    $ref: '#/components/schemas/AssignPublicIp'
                    description: Specifies whether the task's elastic network interface receives a public IP address. You can specify ENABLED only when LaunchType in EcsParameters is set to FARGATE .
                SecurityGroups:
                    $ref: '#/components/schemas/StringList'
                    description: Specifies the security groups associated with the task. These security groups must all be in the same VPC. You can specify as many as five security groups. If you do not specify a security group, the default security group for the VPC is used.
                Subnets:
                    $ref: '#/components/schemas/StringList'
                    description: Specifies the subnets associated with the task. These subnets must all be in the same VPC. You can specify as many as 16 subnets.
            required:
                - Subnets
            type: object
        BatchArrayProperties:
            description: The array properties for the submitted job, such as the size of the array. The array size can be between 2 and 10,000. If you specify array properties for a job, it becomes an array job. This parameter is used only if the target is an Batch job.
