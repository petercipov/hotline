        RoleARNType:
            maxLength: 2048
            minLength: 20
            type: string
        RotateSecretRequest:
            properties:
                ClientRequestToken:
                    $ref: '#/components/schemas/ClientRequestTokenType'
                    description: A unique identifier for the new version of the secret. You only need to specify this value if you implement your own retry logic and you want to ensure that Secrets Manager doesn't attempt to create a secret version twice. If you use the Amazon Web Services CLI or one of the Amazon Web Services SDKs to call this operation, then you can leave this parameter empty. The CLI or SDK generates a random UUID for you and includes it as the value for this parameter in the request. If you generate a raw HTTP request to the Secrets Manager service endpoint, then you must generate a ClientRequestToken and include it in the request. This value helps ensure idempotency. Secrets Manager uses this value to prevent the accidental creation of duplicate versions if there are failures and retries during a rotation. We recommend that you generate a UUID-type value to ensure uniqueness of your versions within the specified secret.
                ExternalSecretRotationMetadata:
                    $ref: '#/components/schemas/ExternalSecretRotationMetadataType'
                    description: The metadata needed to successfully rotate a managed external secret. A list of key value pairs in JSON format specified by the partner. For more information about the required information, see Using Secrets Manager managed external secrets
                ExternalSecretRotationRoleArn:
                    $ref: '#/components/schemas/RoleARNType'
                    description: The Amazon Resource Name (ARN) of the role that allows Secrets Manager to rotate a secret held by a third-party partner. For more information, see Security and permissions .
                RotateImmediately:
                    $ref: '#/components/schemas/BooleanType'
                    description: 'Specifies whether to rotate the secret immediately or wait until the next scheduled rotation window. The rotation schedule is defined in RotateSecretRequest$RotationRules . The default for RotateImmediately is true . If you don''t specify this value, Secrets Manager rotates the secret immediately. If you set RotateImmediately to false , Secrets Manager tests the rotation configuration by running the testSecret step of the Lambda rotation function. This test creates an AWSPENDING version of the secret and then removes it. When changing an existing rotation schedule and setting RotateImmediately to false : If using AutomaticallyAfterDays or a ScheduleExpression with rate() , the previously scheduled rotation might still occur. To prevent unintended rotations, use a ScheduleExpression with cron() for granular control over rotation windows. Rotation is an asynchronous process. For more information, see How rotation works .'
                RotationLambdaARN:
                    $ref: '#/components/schemas/RotationLambdaARNType'
                    description: For secrets that use a Lambda rotation function to rotate, the ARN of the Lambda rotation function. For secrets that use managed rotation , omit this field. For more information, see Managed rotation in the Secrets Manager User Guide .
                RotationRules:
                    $ref: '#/components/schemas/RotationRulesType'
                    description: 'A structure that defines the rotation configuration for this secret. When changing an existing rotation schedule and setting RotateImmediately to false : If using AutomaticallyAfterDays or a ScheduleExpression with rate() , the previously scheduled rotation might still occur. To prevent unintended rotations, use a ScheduleExpression with cron() for granular control over rotation windows.'
                SecretId:
                    $ref: '#/components/schemas/SecretIdType'
                    description: The ARN or name of the secret to rotate. For an ARN, we recommend that you specify a complete ARN rather than a partial ARN. See Finding a secret from a partial ARN .
            required:
                - SecretId
            type: object
        RotateSecretResponse:
            properties:
                ARN:
                    $ref: '#/components/schemas/SecretARNType'
                    description: The ARN of the secret.
                Name:
                    $ref: '#/components/schemas/SecretNameType'
                    description: The name of the secret.
                VersionId:
                    $ref: '#/components/schemas/SecretVersionIdType'
                    description: The ID of the new version of the secret.
            type: object
        RotationEnabledType:
            type: boolean
        RotationLambdaARNType:
            maxLength: 2048
            minLength: 0
            type: string
        RotationRulesType:
            description: A structure that defines the rotation configuration for the secret.
            properties:
                AutomaticallyAfterDays:
                    $ref: '#/components/schemas/AutomaticallyRotateAfterDaysType'
                    description: The number of days between rotations of the secret. You can use this value to check that your secret meets your compliance guidelines for how often secrets must be rotated. If you use this field to set the rotation schedule, Secrets Manager calculates the next rotation date based on the previous rotation. Manually updating the secret value by calling PutSecretValue or UpdateSecret is considered a valid rotation. In DescribeSecret and ListSecrets , this value is calculated from the rotation schedule after every successful rotation. In RotateSecret , you can set the rotation schedule in RotationRules with AutomaticallyAfterDays or ScheduleExpression , but not both. To set a rotation schedule in hours, use ScheduleExpression .
                Duration:
                    $ref: '#/components/schemas/DurationType'
                    description: The length of the rotation window in hours, for example 3h for a three hour window. Secrets Manager rotates your secret at any time during this window. The window must not extend into the next rotation window or the next UTC day. The window starts according to the ScheduleExpression . If you don't specify a Duration , for a ScheduleExpression in hours, the window automatically closes after one hour. For a ScheduleExpression in days, the window automatically closes at the end of the UTC day. For more information, including examples, see Schedule expressions in Secrets Manager rotation in the Secrets Manager Users Guide .
                ScheduleExpression:
                    $ref: '#/components/schemas/ScheduleExpressionType'
                    description: A cron() or rate() expression that defines the schedule for rotating your secret. Secrets Manager rotation schedules use UTC time zone. Secrets Manager rotates your secret any time during a rotation window. Secrets Manager rate() expressions represent the interval in hours or days that you want to rotate your secret, for example rate(12 hours) or rate(10 days) . You can rotate a secret as often as every four hours. If you use a rate() expression, the rotation window starts at midnight. For a rate in hours, the default rotation window closes after one hour. For a rate in days, the default rotation window closes at the end of the day. You can set the Duration to change the rotation window. The rotation window must not extend into the next UTC day or into the next rotation window. You can use a cron() expression to create a rotation schedule that is more detailed than a rotation interval. For more information, including examples, see Schedule expressions in Secrets Manager rotation in the Secrets Manager Users Guide . For a cron expression that represents a schedule in hours, the default rotation window closes after one hour. For a cron expression that represents a schedule in days, the default rotation window closes at the end of the day. You can set the Duration to change the rotation window. The rotation window must not extend into the next UTC day or into the next rotation window.
            type: object
        RotationTokenType:
            maxLength: 256
            minLength: 36
            pattern: ^[a-zA-Z0-9\-]+$
            type: string
        ScheduleExpressionType:
            maxLength: 256
            minLength: 1
            pattern: ^[0-9A-Za-z\(\)#\?\*\-\/, ]+$
            type: string
        SecretARNType:
            maxLength: 2048
            minLength: 20
            type: string
        SecretBinaryType:
            contentEncoding: base64
            maxLength: 65536
            minLength: 1
            type: string
        SecretIdListType:
            items:
                $ref: '#/components/schemas/SecretIdType'
            maxItems: 20
            minItems: 1
            type: array
        SecretIdType:
            maxLength: 2048
            minLength: 1
            type: string
        SecretListEntry:
            description: A structure that contains the details about a secret. It does not include the encrypted SecretString and SecretBinary values. To get those values, use GetSecretValue .
            properties:
                ARN:
                    $ref: '#/components/schemas/SecretARNType'
                    description: The Amazon Resource Name (ARN) of the secret.
                CreatedDate:
                    $ref: '#/components/schemas/TimestampType'
                    description: The date and time when a secret was created.
                DeletedDate:
                    $ref: '#/components/schemas/DeletedDateType'
                    description: The date and time the deletion of the secret occurred. Not present on active secrets. The secret can be recovered until the number of days in the recovery window has passed, as specified in the RecoveryWindowInDays parameter of the DeleteSecret operation.
                Description:
                    $ref: '#/components/schemas/DescriptionType'
                    description: The user-provided description of the secret.
                ExternalSecretRotationMetadata:
                    $ref: '#/components/schemas/ExternalSecretRotationMetadataType'
                    description: The metadata needed to successfully rotate a managed external secret. A list of key value pairs in JSON format specified by the partner. For more information about the required information, see Managed external secrets partners .
                ExternalSecretRotationRoleArn:
                    $ref: '#/components/schemas/RoleARNType'
                    description: The role that Secrets Manager assumes to call APIs required to perform the rotation. For more information about the required information, see Managed external secrets partners .
                KmsKeyId:
                    $ref: '#/components/schemas/KmsKeyIdType'
                    description: The ARN of the KMS key that Secrets Manager uses to encrypt the secret value. If the secret is encrypted with the Amazon Web Services managed key aws/secretsmanager , this field is omitted.
                LastAccessedDate:
                    $ref: '#/components/schemas/LastAccessedDateType'
                    description: The date that the secret was last accessed in the Region. This field is omitted if the secret has never been retrieved in the Region.
                LastChangedDate:
                    $ref: '#/components/schemas/LastChangedDateType'
                    description: The last date and time that this secret was modified in any way.
                LastRotatedDate:
                    $ref: '#/components/schemas/LastRotatedDateType'
                    description: The most recent date and time that the Secrets Manager rotation process was successfully completed. This value is null if the secret hasn't ever rotated.
                Name:
                    $ref: '#/components/schemas/SecretNameType'
                    description: The friendly name of the secret.
                NextRotationDate:
                    $ref: '#/components/schemas/NextRotationDateType'
                    description: The next rotation is scheduled to occur on or before this date. If the secret isn't configured for rotation or rotation has been disabled, Secrets Manager returns null.
                OwningService:
                    $ref: '#/components/schemas/OwningServiceType'
                    description: Returns the name of the service that created the secret.
                PrimaryRegion:
                    $ref: '#/components/schemas/RegionType'
                    description: The Region where Secrets Manager originated the secret.
                RotationEnabled:
                    $ref: '#/components/schemas/RotationEnabledType'
                    description: Indicates whether automatic, scheduled rotation is enabled for this secret.
                RotationLambdaARN:
                    $ref: '#/components/schemas/RotationLambdaARNType'
                    description: The ARN of an Amazon Web Services Lambda function invoked by Secrets Manager to rotate and expire the secret either automatically per the schedule or manually by a call to RotateSecret .
                RotationRules:
                    $ref: '#/components/schemas/RotationRulesType'
                    description: A structure that defines the rotation configuration for the secret.
                SecretVersionsToStages:
                    $ref: '#/components/schemas/SecretVersionsToStagesMapType'
                    description: A list of all of the currently assigned SecretVersionStage staging labels and the SecretVersionId attached to each one. Staging labels are used to keep track of the different versions during the rotation process. A version that does not have any SecretVersionStage is considered deprecated and subject to deletion. Such versions are not included in this list.
                Tags:
                    $ref: '#/components/schemas/TagListType'
                    description: The list of user-defined tags associated with the secret. To add tags to a secret, use TagResource . To remove tags, use UntagResource .
                Type:
                    $ref: '#/components/schemas/MedeaTypeType'
                    description: The exact string that identifies the third-party partner that holds the external secret. For more information, see Managed external secret partners .
            type: object
        SecretListType:
            items:
                $ref: '#/components/schemas/SecretListEntry'
            type: array
        SecretNameType:
            maxLength: 256
            minLength: 1
            type: string
        SecretStringType:
            maxLength: 65536
            minLength: 1
            type: string
        SecretValueEntry:
            description: A structure that contains the secret value and other details for a secret.
            properties:
                ARN:
                    $ref: '#/components/schemas/SecretARNType'
                    description: The Amazon Resource Name (ARN) of the secret.
                CreatedDate:
                    $ref: '#/components/schemas/CreatedDateType'
                    description: The date the secret was created.
                Name:
                    $ref: '#/components/schemas/SecretNameType'
                    description: The friendly name of the secret.
                SecretBinary:
                    $ref: '#/components/schemas/SecretBinaryType'
                    description: The decrypted secret value, if the secret value was originally provided as binary data in the form of a byte array. The parameter represents the binary data as a base64-encoded string.
                SecretString:
                    $ref: '#/components/schemas/SecretStringType'
                    description: The decrypted secret value, if the secret value was originally provided as a string or through the Secrets Manager console.
                VersionId:
                    $ref: '#/components/schemas/SecretVersionIdType'
                    description: The unique version identifier of this version of the secret.
                VersionStages:
                    $ref: '#/components/schemas/SecretVersionStagesType'
                    description: A list of all of the staging labels currently attached to this version of the secret.
            type: object
        SecretValuesType:
            items:
                $ref: '#/components/schemas/SecretValueEntry'
            type: array
        SecretVersionIdType:
            maxLength: 64
            minLength: 32
            type: string
        SecretVersionStageType:
            maxLength: 256
            minLength: 1
            type: string
        SecretVersionStagesType:
            items:
                $ref: '#/components/schemas/SecretVersionStageType'
            maxItems: 20
            minItems: 1
            type: array
        SecretVersionsListEntry:
            description: A structure that contains information about one version of a secret.
            properties:
                CreatedDate:
                    $ref: '#/components/schemas/CreatedDateType'
                    description: The date and time this version of the secret was created.
                KmsKeyIds:
                    $ref: '#/components/schemas/KmsKeyIdListType'
                    description: The KMS keys used to encrypt the secret version.
                LastAccessedDate:
                    $ref: '#/components/schemas/LastAccessedDateType'
                    description: The date that this version of the secret was last accessed. Note that the resolution of this field is at the date level and does not include the time.
                VersionId:
                    $ref: '#/components/schemas/SecretVersionIdType'
                    description: The unique version identifier of this version of the secret.
                VersionStages:
                    $ref: '#/components/schemas/SecretVersionStagesType'
                    description: An array of staging labels that are currently associated with this version of the secret.
            type: object
        SecretVersionsListType:
            items:
                $ref: '#/components/schemas/SecretVersionsListEntry'
            type: array
        SecretVersionsToStagesMapType:
            additionalProperties:
                $ref: '#/components/schemas/SecretVersionStagesType'
            type: object
        SortByType:
            enum:
                - created-date
                - last-accessed-date
                - last-changed-date
                - name
            type: string
        SortOrderType:
            enum:
                - asc
                - desc
            type: string
        StatusMessageType:
            maxLength: 4096
            minLength: 1
            type: string
        StatusType:
            enum:
                - Failed
                - InProgress
                - InSync
            type: string
        StopReplicationToReplicaRequest:
            properties:
                SecretId:
                    $ref: '#/components/schemas/SecretIdType'
                    description: The name of the secret or the replica ARN. The replica ARN is the same as the original primary secret ARN expect the Region is changed to the replica Region.
            required:
                - SecretId
            type: object
        StopReplicationToReplicaResponse:
            properties:
                ARN:
                    $ref: '#/components/schemas/SecretARNType'
                    description: The ARN of the promoted secret. The ARN is the same as the original primary secret except the Region is changed.
            type: object
        Tag:
            description: A structure that contains information about a tag.
            properties:
                Key:
                    $ref: '#/components/schemas/TagKeyType'
                    description: The key identifier, or name, of the tag.
                Value:
                    $ref: '#/components/schemas/TagValueType'
                    description: The string value associated with the key of the tag.
            type: object
        TagKeyListType:
            items:
                $ref: '#/components/schemas/TagKeyType'
            type: array
        TagKeyType:
            maxLength: 128
            minLength: 1
            type: string
        TagListType:
            items:
                $ref: '#/components/schemas/Tag'
            type: array
        TagResourceRequest:
            properties:
                SecretId:
                    $ref: '#/components/schemas/SecretIdType'
                    description: The identifier for the secret to attach tags to. You can specify either the Amazon Resource Name (ARN) or the friendly name of the secret. For an ARN, we recommend that you specify a complete ARN rather than a partial ARN. See Finding a secret from a partial ARN .
                Tags:
                    $ref: '#/components/schemas/TagListType'
                    description: The tags to attach to the secret as a JSON text string argument. Each element in the list consists of a Key and a Value . For storing multiple values, we recommend that you use a JSON text string argument and specify key/value pairs. For more information, see Specifying parameter values for the Amazon Web Services CLI in the Amazon Web Services CLI User Guide.
            required:
                - SecretId
                - Tags
            type: object
        TagValueType:
            maxLength: 256
            minLength: 0
            type: string
        TimestampType:
            type: number
        UntagResourceRequest:
            properties:
                SecretId:
                    $ref: '#/components/schemas/SecretIdType'
                    description: The ARN or name of the secret. For an ARN, we recommend that you specify a complete ARN rather than a partial ARN. See Finding a secret from a partial ARN .
                TagKeys:
                    $ref: '#/components/schemas/TagKeyListType'
                    description: A list of tag key names to remove from the secret. You don't specify the value. Both the key and its associated value are removed. This parameter requires a JSON text string argument. For storing multiple values, we recommend that you use a JSON text string argument and specify key/value pairs. For more information, see Specifying parameter values for the Amazon Web Services CLI in the Amazon Web Services CLI User Guide.
            required:
                - SecretId
                - TagKeys
            type: object
        UpdateSecretRequest:
            properties:
                ClientRequestToken:
                    $ref: '#/components/schemas/ClientRequestTokenType'
                    description: If you include SecretString or SecretBinary , then Secrets Manager creates a new version for the secret, and this parameter specifies the unique identifier for the new version. If you use the Amazon Web Services CLI or one of the Amazon Web Services SDKs to call this operation, then you can leave this parameter empty. The CLI or SDK generates a random UUID for you and includes it as the value for this parameter in the request. If you generate a raw HTTP request to the Secrets Manager service endpoint, then you must generate a ClientRequestToken and include it in the request. This value helps ensure idempotency. Secrets Manager uses this value to prevent the accidental creation of duplicate versions if there are failures and retries during a rotation. We recommend that you generate a UUID-type value to ensure uniqueness of your versions within the specified secret.
                Description:
                    $ref: '#/components/schemas/DescriptionType'
                    description: The description of the secret.
                KmsKeyId:
                    $ref: '#/components/schemas/KmsKeyIdType'
                    description: 'The ARN, key ID, or alias of the KMS key that Secrets Manager uses to encrypt new secret versions as well as any existing versions with the staging labels AWSCURRENT , AWSPENDING , or AWSPREVIOUS . If you don''t have kms:Encrypt permission to the new key, Secrets Manager does not re-encrypt existing secret versions with the new key. For more information about versions and staging labels, see Concepts: Version . A key alias is always prefixed by alias/ , for example alias/aws/secretsmanager . For more information, see About aliases . If you set this to an empty string, Secrets Manager uses the Amazon Web Services managed key aws/secretsmanager . If this key doesn''t already exist in your account, then Secrets Manager creates it for you automatically. All users and roles in the Amazon Web Services account automatically have access to use aws/secretsmanager . Creating aws/secretsmanager can result in a one-time significant delay in returning the result. You can only use the Amazon Web Services managed key aws/secretsmanager if you call this operation using credentials from the same Amazon Web Services account that owns the secret. If the secret is in a different account, then you must use a customer managed key and provide the ARN of that KMS key in this field. The user making the call must have permissions to both the secret and the KMS key in their respective accounts.'
                SecretBinary:
                    $ref: '#/components/schemas/SecretBinaryType'
                    description: 'The binary data to encrypt and store in the new version of the secret. We recommend that you store your binary data in a file and then pass the contents of the file as a parameter. Either SecretBinary or SecretString must have a value, but not both. You can''t access this parameter in the Secrets Manager console. Sensitive: This field contains sensitive information, so the service does not include it in CloudTrail log entries. If you create your own log entries, you must also avoid logging the information in this field.'
                SecretId:
                    $ref: '#/components/schemas/SecretIdType'
                    description: The ARN or name of the secret. For an ARN, we recommend that you specify a complete ARN rather than a partial ARN. See Finding a secret from a partial ARN .
                SecretString:
                    $ref: '#/components/schemas/SecretStringType'
                    description: 'The text data to encrypt and store in the new version of the secret. We recommend you use a JSON structure of key/value pairs for your secret value. Either SecretBinary or SecretString must have a value, but not both. Sensitive: This field contains sensitive information, so the service does not include it in CloudTrail log entries. If you create your own log entries, you must also avoid logging the information in this field.'
                Type:
                    $ref: '#/components/schemas/MedeaTypeType'
                    description: The exact string that identifies the third-party partner that holds the external secret. For more information, see Managed external secret partners .
            required:
                - SecretId
            type: object
        UpdateSecretResponse:
            properties:
                ARN:
                    $ref: '#/components/schemas/SecretARNType'
                    description: The ARN of the secret that was updated.
                Name:
                    $ref: '#/components/schemas/SecretNameType'
                    description: The name of the secret that was updated.
                VersionId:
                    $ref: '#/components/schemas/SecretVersionIdType'
                    description: If Secrets Manager created a new version of the secret during this operation, then VersionId contains the unique identifier of the new version.
            type: object
        UpdateSecretVersionStageRequest:
            properties:
                MoveToVersionId:
                    $ref: '#/components/schemas/SecretVersionIdType'
                    description: The ID of the version to add the staging label to. To remove a label from a version, then do not specify this parameter. If the staging label is already attached to a different version of the secret, then you must also specify the RemoveFromVersionId parameter.
                RemoveFromVersionId:
                    $ref: '#/components/schemas/SecretVersionIdType'
                    description: The ID of the version that the staging label is to be removed from. If the staging label you are trying to attach to one version is already attached to a different version, then you must include this parameter and specify the version that the label is to be removed from. If the label is attached and you either do not specify this parameter, or the version ID does not match, then the operation fails.
                SecretId:
                    $ref: '#/components/schemas/SecretIdType'
                    description: The ARN or the name of the secret with the version and staging labelsto modify. For an ARN, we recommend that you specify a complete ARN rather than a partial ARN. See Finding a secret from a partial ARN .
                VersionStage:
                    $ref: '#/components/schemas/SecretVersionStageType'
                    description: The staging label to add to this version.
            required:
                - SecretId
                - VersionStage
            type: object
        UpdateSecretVersionStageResponse:
            properties:
                ARN:
                    $ref: '#/components/schemas/SecretARNType'
                    description: The ARN of the secret that was updated.
                Name:
                    $ref: '#/components/schemas/SecretNameType'
                    description: The name of the secret that was updated.
            type: object
        ValidateResourcePolicyRequest:
            properties:
                ResourcePolicy:
                    $ref: '#/components/schemas/NonEmptyResourcePolicyType'
                    description: A JSON-formatted string that contains an Amazon Web Services resource-based policy. The policy in the string identifies who can access or manage this secret and its versions. For example policies, see Permissions policy examples .
                SecretId:
                    $ref: '#/components/schemas/SecretIdType'
                    description: The ARN or name of the secret with the resource-based policy you want to validate.
            required:
                - ResourcePolicy
            type: object
        ValidateResourcePolicyResponse:
            properties:
                PolicyValidationPassed:
                    $ref: '#/components/schemas/BooleanType'
                    description: True if your policy passes validation, otherwise false.
                ValidationErrors:
                    $ref: '#/components/schemas/ValidationErrorsType'
                    description: Validation errors if your policy didn't pass validation.
            type: object
        ValidationErrorsEntry:
            description: Displays errors that occurred during validation of the resource policy.
            properties:
                CheckName:
                    $ref: '#/components/schemas/NameType'
                    description: Checks the name of the policy.
                ErrorMessage:
                    $ref: '#/components/schemas/ErrorMessage'
                    description: Displays error messages if validation encounters problems during validation of the resource policy.
            type: object
        ValidationErrorsType:
            items:
                $ref: '#/components/schemas/ValidationErrorsEntry'
            type: array
    securitySchemes:
        aws_sigv4:
            in: header
            name: Authorization
            type: apiKey
