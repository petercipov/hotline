components:
    schemas:
        APIErrorListType:
            items:
                $ref: '#/components/schemas/APIErrorType'
            type: array
        APIErrorType:
            description: The error Secrets Manager encountered while retrieving an individual secret as part of BatchGetSecretValue .
            properties:
                ErrorCode:
                    $ref: '#/components/schemas/ErrorCode'
                    description: The error Secrets Manager encountered while retrieving an individual secret as part of BatchGetSecretValue , for example ResourceNotFoundException , InvalidParameterException , InvalidRequestException , DecryptionFailure , or AccessDeniedException .
                Message:
                    $ref: '#/components/schemas/ErrorMessage'
                    description: A message describing the error.
                SecretId:
                    $ref: '#/components/schemas/SecretIdType'
                    description: The ARN or name of the secret.
            type: object
        AddReplicaRegionListType:
            items:
                $ref: '#/components/schemas/ReplicaRegionType'
            minItems: 1
            type: array
        AutomaticallyRotateAfterDaysType:
            format: int64
            maximum: 1000
            minimum: 1
            type: integer
        AwsJsonError:
            description: 'The body of every AWS JSON error reply: __type names the error.'
            properties:
                __type:
                    type: string
                Message:
                    type: string
                message:
                    type: string
            required:
                - __type
            type: object
        BatchGetSecretValueRequest:
            properties:
                Filters:
                    $ref: '#/components/schemas/FiltersListType'
                    description: The filters to choose which secrets to retrieve. You must include Filters or SecretIdList , but not both.
                MaxResults:
                    $ref: '#/components/schemas/MaxResultsBatchType'
                    description: The number of results to include in the response. If there are more results available, in the response, Secrets Manager includes NextToken . To get the next results, call BatchGetSecretValue again with the value from NextToken . To use this parameter, you must also use the Filters parameter.
                NextToken:
                    $ref: '#/components/schemas/NextTokenType'
                    description: A token that indicates where the output should continue from, if a previous call did not show all results. To get the next results, call BatchGetSecretValue again with this value.
                SecretIdList:
                    $ref: '#/components/schemas/SecretIdListType'
                    description: The ARN or names of the secrets to retrieve. You must include Filters or SecretIdList , but not both.
            type: object
        BatchGetSecretValueResponse:
            properties:
                Errors:
                    $ref: '#/components/schemas/APIErrorListType'
                    description: A list of errors Secrets Manager encountered while attempting to retrieve individual secrets.
                NextToken:
                    $ref: '#/components/schemas/NextTokenType'
                    description: Secrets Manager includes this value if there's more output available than what is included in the current response. This can occur even when the response includes no values at all, such as when you ask for a filtered view of a long list. To get the next results, call BatchGetSecretValue again with this value.
                SecretValues:
                    $ref: '#/components/schemas/SecretValuesType'
                    description: A list of secret values.
            type: object
        BooleanType:
            type: boolean
        CancelRotateSecretRequest:
            properties:
                SecretId:
                    $ref: '#/components/schemas/SecretIdType'
                    description: The ARN or name of the secret. For an ARN, we recommend that you specify a complete ARN rather than a partial ARN. See Finding a secret from a partial ARN .
            required:
                - SecretId
            type: object
        CancelRotateSecretResponse:
            properties:
                ARN:
                    $ref: '#/components/schemas/SecretARNType'
                    description: The ARN of the secret.
                Name:
                    $ref: '#/components/schemas/SecretNameType'
                    description: The name of the secret.
                VersionId:
                    $ref: '#/components/schemas/SecretVersionIdType'
                    description: The unique identifier of the version of the secret created during the rotation. This version might not be complete, and should be evaluated for possible deletion. We recommend that you remove the VersionStage value AWSPENDING from this version so that Secrets Manager can delete it. Failing to clean up a cancelled rotation can block you from starting future rotations.
            type: object
        ClientRequestTokenType:
            maxLength: 64
            minLength: 32
            type: string
        CreateSecretRequest:
            properties:
                AddReplicaRegions:
                    $ref: '#/components/schemas/AddReplicaRegionListType'
                    description: A list of Regions and KMS keys to replicate secrets.
                ClientRequestToken:
                    $ref: '#/components/schemas/ClientRequestTokenType'
                    description: If you include SecretString or SecretBinary , then Secrets Manager creates an initial version for the secret, and this parameter specifies the unique identifier for the new version. If you use the Amazon Web Services CLI or one of the Amazon Web Services SDKs to call this operation, then you can leave this parameter empty. The CLI or SDK generates a random UUID for you and includes it as the value for this parameter in the request. If you generate a raw HTTP request to the Secrets Manager service endpoint, then you must generate a ClientRequestToken and include it in the request. This value helps ensure idempotency. Secrets Manager uses this value to prevent the accidental creation of duplicate versions if there are failures and retries during a rotation. We recommend that you generate a UUID-type value to ensure uniqueness of your versions within the specified secret. If the ClientRequestToken value isn't already associated with a version of the secret then a new version of the secret is created. If a version with this value already exists and the version SecretString and SecretBinary values are the same as those in the request, then the request is ignored. If a version with this value already exists and that version's SecretString and SecretBinary values are different from those in the request, then the request fails because you cannot modify an existing version. Instead, use PutSecretValue to create a new version. This value becomes the VersionId of the new version.
                Description:
                    $ref: '#/components/schemas/DescriptionType'
                    description: The description of the secret.
                ForceOverwriteReplicaSecret:
                    $ref: '#/components/schemas/BooleanType'
                    description: Specifies whether to overwrite a secret with the same name in the destination Region. By default, secrets aren't overwritten.
                KmsKeyId:
                    $ref: '#/components/schemas/KmsKeyIdType'
                    description: The ARN, key ID, or alias of the KMS key that Secrets Manager uses to encrypt the secret value in the secret. An alias is always prefixed by alias/ , for example alias/aws/secretsmanager . For more information, see About aliases . To use a KMS key in a different account, use the key ARN or the alias ARN. If you don't specify this value, then Secrets Manager uses the key aws/secretsmanager . If that key doesn't yet exist, then Secrets Manager creates it for you automatically the first time it encrypts the secret value. If the secret is in a different Amazon Web Services account from the credentials calling the API, then you can't use aws/secretsmanager to encrypt the secret, and you must create and use a customer managed KMS key.
                Name:
                    $ref: '#/components/schemas/NameType'
                    description: 'The name of the new secret. The secret name can contain ASCII letters, numbers, and the following characters: /_+=.@- Do not end your secret name with a hyphen followed by six characters. If you do so, you risk confusion and unexpected results when searching for a secret by partial ARN. Secrets Manager automatically adds a hyphen and six random characters after the secret name at the end of the ARN.'
                SecretBinary:
                    $ref: '#/components/schemas/SecretBinaryType'
                    description: 'The binary data to encrypt and store in the new version of the secret. We recommend that you store your binary data in a file and then pass the contents of the file as a parameter. Either SecretString or SecretBinary must have a value, but not both. This parameter is not available in the Secrets Manager console. Sensitive: This field contains sensitive information, so the service does not include it in CloudTrail log entries. If you create your own log entries, you must also avoid logging the information in this field.'
                SecretString:
                    $ref: '#/components/schemas/SecretStringType'
                    description: 'The text data to encrypt and store in this new version of the secret. We recommend you use a JSON structure of key/value pairs for your secret value. Either SecretString or SecretBinary must have a value, but not both. If you create a secret by using the Secrets Manager console then Secrets Manager puts the protected secret text in only the SecretString parameter. The Secrets Manager console stores the information as a JSON structure of key/value pairs that a Lambda rotation function can parse. Sensitive: This field contains sensitive information, so the service does not include it in CloudTrail log entries. If you create your own log entries, you must also avoid logging the information in this field.'
                Tags:
                    $ref: '#/components/schemas/TagListType'
                    description: 'A list of tags to attach to the secret. Each tag is a key and value pair of strings in a JSON text string, for example: [{"Key":"CostCenter","Value":"12345"},{"Key":"environment","Value":"production"}] Secrets Manager tag key names are case sensitive. A tag with the key "ABC" is a different tag from one with key "abc". If you check tags in permissions policies as part of your security strategy, then adding or removing a tag can change permissions. If the completion of this operation would result in you losing your permissions for this secret, then Secrets Manager blocks the operation and returns an Access Denied error. For more information, see Control access to secrets using tags and Limit access to identities with tags that match secrets'' tags . For information about how to format a JSON parameter for the various command line tool environments, see Using JSON for Parameters . If your command-line tool or SDK requires quotation marks around the parameter, you should use single quotes to avoid confusion with the double quotes required in the JSON text. For tag quotas and naming restrictions, see Service quotas for Tagging in the Amazon Web Services General Reference guide .'
                Type:
                    $ref: '#/components/schemas/MedeaTypeType'
                    description: The exact string that identifies the partner that holds the external secret. For more information, see Using Secrets Manager managed external secrets .
            required:
                - Name
            type: object
        CreateSecretResponse:
            properties:
                ARN:
                    $ref: '#/components/schemas/SecretARNType'
                    description: The ARN of the new secret. The ARN includes the name of the secret followed by six random characters. This ensures that if you create a new secret with the same name as a deleted secret, then users with access to the old secret don't get access to the new secret because the ARNs are different.
                Name:
                    $ref: '#/components/schemas/SecretNameType'
                    description: The name of the new secret.
                ReplicationStatus:
                    $ref: '#/components/schemas/ReplicationStatusListType'
                    description: 'A list of the replicas of this secret and their status: Failed , which indicates that the replica was not created. InProgress , which indicates that Secrets Manager is in the process of creating the replica. InSync , which indicates that the replica was created.'
                VersionId:
                    $ref: '#/components/schemas/SecretVersionIdType'
                    description: The unique identifier associated with the version of the new secret.
            type: object
        CreatedDateType:
            type: number
        DeleteResourcePolicyRequest:
            properties:
                SecretId:
                    $ref: '#/components/schemas/SecretIdType'
                    description: The ARN or name of the secret to delete the attached resource-based policy for. For an ARN, we recommend that you specify a complete ARN rather than a partial ARN. See Finding a secret from a partial ARN .
            required:
                - SecretId
            type: object
        DeleteResourcePolicyResponse:
            properties:
                ARN:
                    $ref: '#/components/schemas/SecretARNType'
                    description: The ARN of the secret that the resource-based policy was deleted for.
                Name:
                    $ref: '#/components/schemas/NameType'
                    description: The name of the secret that the resource-based policy was deleted for.
            type: object
        DeleteSecretRequest:
            properties:
                ForceDeleteWithoutRecovery:
                    $ref: '#/components/schemas/BooleanType'
                    description: Specifies whether to delete the secret without any recovery window. You can't use both this parameter and RecoveryWindowInDays in the same call. If you don't use either, then by default Secrets Manager uses a 30 day recovery window. Secrets Manager performs the actual deletion with an asynchronous background process, so there might be a short delay before the secret is permanently deleted. If you delete a secret and then immediately create a secret with the same name, use appropriate back off and retry logic. If you forcibly delete an already deleted or nonexistent secret, the operation does not return ResourceNotFoundException . Use this parameter with caution. This parameter causes the operation to skip the normal recovery window before the permanent deletion that Secrets Manager would normally impose with the RecoveryWindowInDays parameter. If you delete a secret with the ForceDeleteWithoutRecovery parameter, then you have no opportunity to recover the secret. You lose the secret permanently.
                RecoveryWindowInDays:
                    $ref: '#/components/schemas/RecoveryWindowInDaysType'
                    description: The number of days from 7 to 30 that Secrets Manager waits before permanently deleting the secret. You can't use both this parameter and ForceDeleteWithoutRecovery in the same call. If you don't use either, then by default Secrets Manager uses a 30 day recovery window.
                SecretId:
                    $ref: '#/components/schemas/SecretIdType'
                    description: The ARN or name of the secret to delete. For an ARN, we recommend that you specify a complete ARN rather than a partial ARN. See Finding a secret from a partial ARN .
            required:
                - SecretId
            type: object
        DeleteSecretResponse:
            properties:
                ARN:
                    $ref: '#/components/schemas/SecretARNType'
                    description: The ARN of the secret.
                DeletionDate:
                    $ref: '#/components/schemas/DeletionDateType'
                    description: The date and time after which this secret Secrets Manager can permanently delete this secret, and it can no longer be restored. This value is the date and time of the delete request plus the number of days in RecoveryWindowInDays .
                Name:
                    $ref: '#/components/schemas/SecretNameType'
                    description: The name of the secret.
            type: object
        DeletedDateType:
            type: number
        DeletionDateType:
            type: number
        DescribeSecretRequest:
            properties:
                SecretId:
                    $ref: '#/components/schemas/SecretIdType'
                    description: The ARN or name of the secret. For an ARN, we recommend that you specify a complete ARN rather than a partial ARN. See Finding a secret from a partial ARN .
            required:
                - SecretId
            type: object
        DescribeSecretResponse:
            properties:
                ARN:
                    $ref: '#/components/schemas/SecretARNType'
                    description: The ARN of the secret.
                CreatedDate:
                    $ref: '#/components/schemas/TimestampType'
                    description: The date the secret was created.
                DeletedDate:
                    $ref: '#/components/schemas/DeletedDateType'
                    description: The date the secret is scheduled for deletion. If it is not scheduled for deletion, this field is omitted. When you delete a secret, Secrets Manager requires a recovery window of at least 7 days before deleting the secret. Some time after the deleted date, Secrets Manager deletes the secret, including all of its versions. If a secret is scheduled for deletion, then its details, including the encrypted secret value, is not accessible. To cancel a scheduled deletion and restore access to the secret, use RestoreSecret .
                Description:
                    $ref: '#/components/schemas/DescriptionType'
                    description: The description of the secret.
                ExternalSecretRotationMetadata:
                    $ref: '#/components/schemas/ExternalSecretRotationMetadataType'
                    description: The metadata needed to successfully rotate a managed external secret. A list of key value pairs in JSON format specified by the partner. For more information about the required information, see Managed external secrets partners .
                ExternalSecretRotationRoleArn:
                    $ref: '#/components/schemas/RoleARNType'
                    description: The Amazon Resource Name (ARN) of the role that allows Secrets Manager to rotate a secret held by a third-party partner. For more information, see Security and permissions .
                KmsKeyId:
                    $ref: '#/components/schemas/KmsKeyIdType'
                    description: The key ID or alias ARN of the KMS key that Secrets Manager uses to encrypt the secret value. If the secret is encrypted with the Amazon Web Services managed key aws/secretsmanager , this field is omitted. Secrets created using the console use an KMS key ID.
                LastAccessedDate:
                    $ref: '#/components/schemas/LastAccessedDateType'
                    description: The date that the secret was last accessed in the Region. This field is omitted if the secret has never been retrieved in the Region.
                LastChangedDate:
                    $ref: '#/components/schemas/LastChangedDateType'
                    description: The last date and time that this secret was modified in any way.
                LastRotatedDate:
                    $ref: '#/components/schemas/LastRotatedDateType'
                    description: The last date and time that Secrets Manager rotated the secret. If the secret isn't configured for rotation or rotation has been disabled, Secrets Manager returns null.
                Name:
                    $ref: '#/components/schemas/SecretNameType'
                    description: The name of the secret.
                NextRotationDate:
                    $ref: '#/components/schemas/NextRotationDateType'
                    description: The next rotation is scheduled to occur on or before this date. If the secret isn't configured for rotation or rotation has been disabled, Secrets Manager returns null. If rotation fails, Secrets Manager retries the entire rotation process multiple times. If rotation is unsuccessful, this date may be in the past. This date represents the latest date that rotation will occur, but it is not an approximate rotation date. In some cases, for example if you turn off automatic rotation and then turn it back on, the next rotation may occur much sooner than this date.
                OwningService:
                    $ref: '#/components/schemas/OwningServiceType'
                    description: The ID of the service that created this secret. For more information, see Secrets managed by other Amazon Web Services services .
                PrimaryRegion:
                    $ref: '#/components/schemas/RegionType'
                    description: The Region the secret is in. If a secret is replicated to other Regions, the replicas are listed in ReplicationStatus .
                ReplicationStatus:
                    $ref: '#/components/schemas/ReplicationStatusListType'
                    description: 'A list of the replicas of this secret and their status: Failed , which indicates that the replica was not created. InProgress , which indicates that Secrets Manager is in the process of creating the replica. InSync , which indicates that the replica was created.'
                RotationEnabled:
                    $ref: '#/components/schemas/RotationEnabledType'
                    description: Specifies whether automatic rotation is turned on for this secret. If the secret has never been configured for rotation, Secrets Manager returns null. To turn on rotation, use RotateSecret . To turn off rotation, use CancelRotateSecret .
                RotationLambdaARN:
                    $ref: '#/components/schemas/RotationLambdaARNType'
                    description: The ARN of the Lambda function that Secrets Manager invokes to rotate the secret.
                RotationRules:
                    $ref: '#/components/schemas/RotationRulesType'
                    description: The rotation schedule and Lambda function for this secret. If the secret previously had rotation turned on, but it is now turned off, this field shows the previous rotation schedule and rotation function. If the secret never had rotation turned on, this field is omitted.
                Tags:
                    $ref: '#/components/schemas/TagListType'
                    description: The list of tags attached to the secret. To add tags to a secret, use TagResource . To remove tags, use UntagResource .
                Type:
                    $ref: '#/components/schemas/MedeaTypeType'
                    description: The exact string that identifies the partner that holds the external secret. For more information, see Using Secrets Manager managed external secrets .
                VersionIdsToStages:
                    $ref: '#/components/schemas/SecretVersionsToStagesMapType'
                    description: 'A list of the versions of the secret that have staging labels attached. Versions that don''t have staging labels are considered deprecated and Secrets Manager can delete them. Secrets Manager uses staging labels to indicate the status of a secret version during rotation. The three staging labels for rotation are: AWSCURRENT , which indicates the current version of the secret. AWSPENDING , which indicates the version of the secret that contains new secret information that will become the next current version when rotation finishes. During rotation, Secrets Manager creates an AWSPENDING version ID before creating the new secret version. To check if a secret version exists, call GetSecretValue . AWSPREVIOUS , which indicates the previous current version of the secret. You can use this as the last known good version. For more information about rotation and staging labels, see How rotation works .'
            type: object
        DescriptionType:
            maxLength: 2048
            minLength: 0
            type: string
        DurationType:
            maxLength: 3
