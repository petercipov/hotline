                    description: The date and time that this version of the secret was created. If you don't specify which version in VersionId or VersionStage , then Secrets Manager uses the AWSCURRENT version.
                Name:
                    $ref: '#/components/schemas/SecretNameType'
                    description: The friendly name of the secret.
                SecretBinary:
                    $ref: '#/components/schemas/SecretBinaryType'
                    description: 'The decrypted secret value, if the secret value was originally provided as binary data in the form of a byte array. When you retrieve a SecretBinary using the HTTP API, the Python SDK, or the Amazon Web Services CLI, the value is Base64-encoded. Otherwise, it is not encoded. If the secret was created by using the Secrets Manager console, or if the secret value was originally provided as a string, then this field is omitted. The secret value appears in SecretString instead. Sensitive: This field contains sensitive information, so the service does not include it in CloudTrail log entries. If you create your own log entries, you must also avoid logging the information in this field.'
                SecretString:
                    $ref: '#/components/schemas/SecretStringType'
                    description: 'The decrypted secret value, if the secret value was originally provided as a string or through the Secrets Manager console. If this secret was created by using the console, then Secrets Manager stores the information as a JSON structure of key/value pairs. Sensitive: This field contains sensitive information, so the service does not include it in CloudTrail log entries. If you create your own log entries, you must also avoid logging the information in this field.'
                VersionId:
                    $ref: '#/components/schemas/SecretVersionIdType'
                    description: The unique identifier of this version of the secret.
                VersionStages:
                    $ref: '#/components/schemas/SecretVersionStagesType'
                    description: A list of all of the staging labels currently attached to this version of the secret.
            type: object
