        DkimAttributes:
            description: An object that contains information about the DKIM authentication status for an email identity. Amazon SES determines the authentication status by searching for specific records in the DNS configuration for the domain. If you used Easy DKIM to set up DKIM authentication, Amazon SES tries to find three unique CNAME records in the DNS configuration for your domain. If you provided a public key to perform DKIM authentication, Amazon SES tries to find a TXT record that uses the selector that you specified. The value of the TXT record must be a public key that's paired with the private key that you specified in the process of creating the identity
            properties:
                CurrentSigningKeyLength:
                    $ref: '#/components/schemas/DkimSigningKeyLength'
                    description: '[Easy DKIM] The key length of the DKIM key pair in use.'
                LastKeyGenerationTimestamp:
                    $ref: '#/components/schemas/Timestamp'
                    description: '[Easy DKIM] The last time a key pair was generated for this identity.'
                NextSigningKeyLength:
                    $ref: '#/components/schemas/DkimSigningKeyLength'
                    description: '[Easy DKIM] The key length of the future DKIM key pair to be generated. This can be changed at most once per day.'
                SigningAttributesOrigin:
                    $ref: '#/components/schemas/DkimSigningAttributesOrigin'
                    description: 'A string that indicates how DKIM was configured for the identity. These are the possible values: AWS_SES – Indicates that DKIM was configured for the identity by using Easy DKIM . EXTERNAL – Indicates that DKIM was configured for the identity by using Bring Your Own DKIM (BYODKIM). AWS_SES_ – Indicates that DKIM was configured for the identity by replicating the signing attributes of a parent identity in another Amazon Web Services Region, using Deterministic Easy-DKIM (DEED) . is the Amazon Web Services Region of the parent identity, in uppercase with each hyphen replaced by an underscore. Amazon SES uses this format for every Amazon Web Services Region in which it supports DEED. For example, a parent identity in us-east-1 is reported as AWS_SES_US_EAST_1 .'
                SigningEnabled:
                    $ref: '#/components/schemas/Enabled'
                    description: If the value is true , then the messages that you send from the identity are signed using DKIM. If the value is false , then the messages that you send from the identity aren't DKIM-signed.
                SigningHostedZone:
                    $ref: '#/components/schemas/HostedZone'
                    description: 'The hosted zone where Amazon SES publishes the DKIM public key TXT records for this email identity. This value indicates the DNS zone that customers must reference when configuring their CNAME records for DKIM authentication. When configuring DKIM for your domain, create CNAME records in your DNS that point to the selectors in this hosted zone. For example: selector1._domainkey.yourdomain.com CNAME selector1. selector2._domainkey.yourdomain.com CNAME selector2. selector3._domainkey.yourdomain.com CNAME selector3.'
                Status:
                    $ref: '#/components/schemas/DkimStatus'
                    description: 'Describes whether or not Amazon SES has successfully located the DKIM records in the DNS records for the domain. The status can be one of the following: PENDING – The verification process was initiated, but Amazon SES hasn''t yet detected the DKIM records in the DNS configuration for the domain. SUCCESS – The verification process completed successfully. FAILED – The verification process failed. This typically occurs when Amazon SES fails to find the DKIM records in the DNS configuration of the domain. TEMPORARY_FAILURE – A temporary issue is preventing Amazon SES from determining the DKIM authentication status of the domain. NOT_STARTED – The DKIM verification process hasn''t been initiated for the domain.'
                Tokens:
                    $ref: '#/components/schemas/DnsTokenList'
                    description: If you used Easy DKIM to configure DKIM authentication for the domain, then this object contains a set of unique strings that you use to create a set of CNAME records that you add to the DNS configuration for your domain. When Amazon SES detects these records in the DNS configuration for your domain, the DKIM authentication process is complete. If you configured DKIM authentication for the domain by providing your own public-private key pair, then this object contains the selector for the public key. Regardless of the DKIM authentication method you use, Amazon SES searches for the appropriate records in the DNS configuration of the domain for up to 72 hours.
            type: object
        DkimSigningAttributes:
            description: An object that contains configuration for Bring Your Own DKIM (BYODKIM), or, for Easy DKIM
            properties:
                DomainSigningAttributesOrigin:
                    $ref: '#/components/schemas/DkimSigningAttributesOrigin'
                    description: 'The attribute to use for configuring DKIM for the identity depends on the operation: For PutEmailIdentityDkimSigningAttributes : None of the values are allowed - use the SigningAttributesOrigin parameter instead For CreateEmailIdentity when replicating a parent identity''s DKIM configuration: Allowed values: All values except AWS_SES and EXTERNAL AWS_SES – Configure DKIM for the identity by using Easy DKIM. EXTERNAL – Configure DKIM for the identity by using Bring Your Own DKIM (BYODKIM). AWS_SES_ – Configure DKIM for the identity by replicating the signing attributes of a parent identity in another Amazon Web Services Region, using Deterministic Easy-DKIM (DEED) . Replace with the Amazon Web Services Region of the parent identity, in uppercase with each hyphen replaced by an underscore. You can specify any Amazon Web Services Region in which Amazon SES supports DEED. For example, to replicate from a parent identity in us-east-1 , specify AWS_SES_US_EAST_1 . The parent identity must already exist in the specified Amazon Web Services Region and have Easy DKIM configured.'
                DomainSigningPrivateKey:
                    $ref: '#/components/schemas/PrivateKey'
                    description: '[Bring Your Own DKIM] A private key that''s used to generate a DKIM signature. The private key must use 1024 or 2048-bit RSA encryption, and must be encoded using base64 encoding.'
                DomainSigningSelector:
                    $ref: '#/components/schemas/Selector'
                    description: '[Bring Your Own DKIM] A string that''s used to identify a public key in the DNS configuration for a domain.'
                NextSigningKeyLength:
                    $ref: '#/components/schemas/DkimSigningKeyLength'
                    description: '[Easy DKIM] The key length of the future DKIM key pair to be generated. This can be changed at most once per day.'
            type: object
        DkimSigningAttributesOrigin:
            enum:
                - AWS_SES
                - AWS_SES_AF_SOUTH_1
                - AWS_SES_AP_NORTHEAST_1
                - AWS_SES_AP_NORTHEAST_2
                - AWS_SES_AP_NORTHEAST_3
                - AWS_SES_AP_SOUTHEAST_1
                - AWS_SES_AP_SOUTHEAST_2
                - AWS_SES_AP_SOUTHEAST_3
                - AWS_SES_AP_SOUTHEAST_5
                - AWS_SES_AP_SOUTH_1
                - AWS_SES_AP_SOUTH_2
                - AWS_SES_CA_CENTRAL_1
                - AWS_SES_CA_WEST_1
                - AWS_SES_EU_CENTRAL_1
                - AWS_SES_EU_CENTRAL_2
                - AWS_SES_EU_NORTH_1
                - AWS_SES_EU_SOUTH_1
                - AWS_SES_EU_WEST_1
                - AWS_SES_EU_WEST_2
                - AWS_SES_EU_WEST_3
                - AWS_SES_IL_CENTRAL_1
                - AWS_SES_ME_CENTRAL_1
                - AWS_SES_ME_SOUTH_1
                - AWS_SES_SA_EAST_1
                - AWS_SES_US_EAST_1
                - AWS_SES_US_EAST_2
                - AWS_SES_US_GOV_EAST_1
                - AWS_SES_US_GOV_WEST_1
                - AWS_SES_US_WEST_1
                - AWS_SES_US_WEST_2
                - EXTERNAL
            type: string
        DkimSigningKeyLength:
            enum:
                - RSA_1024_BIT
                - RSA_2048_BIT
            type: string
        DkimStatus:
            enum:
                - FAILED
                - NOT_STARTED
                - PENDING
                - SUCCESS
                - TEMPORARY_FAILURE
            type: string
        DnsToken:
            type: string
        DnsTokenList:
            items:
                $ref: '#/components/schemas/DnsToken'
            type: array
        Domain:
            type: string
