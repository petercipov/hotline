components:
    schemas:
        AccountDetails:
            description: An object that contains information about your account details.
            properties:
                AdditionalContactEmailAddresses:
                    $ref: '#/components/schemas/AdditionalContactEmailAddresses'
                    description: Additional email addresses where updates are sent about your account review process.
                ContactLanguage:
                    $ref: '#/components/schemas/ContactLanguage'
                    description: The language you would prefer for the case. The contact language can be one of ENGLISH or JAPANESE .
                MailType:
                    $ref: '#/components/schemas/MailType'
                    description: 'The type of email your account is sending. The mail type can be one of the following: MARKETING – Most of your sending traffic is to keep your customers informed of your latest offering. TRANSACTIONAL – Most of your sending traffic is to communicate during a transaction with a customer.'
                ReviewDetails:
                    $ref: '#/components/schemas/ReviewDetails'
                    description: Information about the review of the latest details you submitted.
                UseCaseDescription:
                    $ref: '#/components/schemas/UseCaseDescription'
                    description: A description of the types of email that you plan to send.
                WebsiteURL:
                    $ref: '#/components/schemas/WebsiteURL'
                    description: The URL of your website. This information helps us better understand the type of content that you plan to send.
            type: object
        AdditionalContactEmailAddress:
            maxLength: 254
            minLength: 6
            pattern: ^(.+)@(.+)$
            type: string
        AdditionalContactEmailAddresses:
            items:
                $ref: '#/components/schemas/AdditionalContactEmailAddress'
            maxItems: 4
            minItems: 1
            type: array
        AdminEmail:
            type: string
        AmazonResourceName:
            minLength: 1
            type: string
        ArchiveArn:
            maxLength: 1011
            minLength: 20
            pattern: ^arn:(aws|aws-[a-z-]+):ses:[a-z]{2,4}-[a-z-]+-[0-9]:[0-9]{1,20}:mailmanager-archive/a-[a-z0-9]{24,62}$
            type: string
        ArchivingOptions:
            description: Used to associate a configuration set with a MailManager archive.
            properties:
                ArchiveArn:
                    $ref: '#/components/schemas/ArchiveArn'
                    description: The Amazon Resource Name (ARN) of the MailManager archive where the Amazon SES API v2 will archive sent emails.
            type: object
        AssociateEmailIdentityCertificateRequest:
            properties:
                CertificateArn:
                    $ref: '#/components/schemas/CertificateArn'
                    description: The Amazon Resource Name (ARN) of the Certificate Manager (ACM) certificate to associate with the email identity.
                EmailIdentity:
                    $ref: '#/components/schemas/Identity'
