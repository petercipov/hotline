            type: object
        Subject:
            type: string
        SubscriptionStatus:
            enum:
                - OPT_IN
                - OPT_OUT
            type: string
        SuccessRedirectionURL:
            type: string
        SuppressedDestination:
            description: An object that contains information about an email address that is on the suppression list for your account or for a specific tenant.
            properties:
                Attributes:
                    $ref: '#/components/schemas/SuppressedDestinationAttributes'
                    description: An optional value that can contain additional information about the reasons that the address was added to the suppression list for your account or for a specific tenant.
                EmailAddress:
                    $ref: '#/components/schemas/EmailAddress'
                    description: The email address that is on the suppression list for your account or for a specific tenant.
