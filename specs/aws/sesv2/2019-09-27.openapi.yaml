        BulkEmailEntry:
            properties:
                Destination:
                    $ref: '#/components/schemas/Destination'
                    description: 'Represents the destination of the message, consisting of To:, CC:, and BCC: fields. Amazon SES does not support the SMTPUTF8 extension, as described in RFC6531 . For this reason, the local part of a destination email address (the part of the email address that precedes the @ sign) may only contain 7-bit ASCII characters . If the domain part of an address (the part after the @ sign) contains non-ASCII characters, they must be encoded using Punycode, as described in RFC3492 .'
                ReplacementEmailContent:
                    $ref: '#/components/schemas/ReplacementEmailContent'
                    description: The ReplacementEmailContent associated with a BulkEmailEntry .
                ReplacementHeaders:
                    $ref: '#/components/schemas/MessageHeaderList'
                    description: 'The list of message headers associated with the BulkEmailEntry data type. Headers Not Present in BulkEmailEntry : If a header is specified in Template but not in BulkEmailEntry , the header from Template will be added to the outgoing email. Headers Present in BulkEmailEntry : If a header is specified in BulkEmailEntry , it takes precedence over any header of the same name specified in Template : If the header is also defined within Template , the value from BulkEmailEntry will replace the header''s value in the email. If the header is not defined within Template , it will simply be added to the email as specified in BulkEmailEntry .'
                ReplacementTags:
                    $ref: '#/components/schemas/MessageTagList'
                    description: A list of tags, in the form of name/value pairs, to apply to an email that you send using the SendBulkTemplatedEmail operation. Tags correspond to characteristics of the email that you define, so that you can publish email sending events.
            required:
                - Destination
            type: object
        BulkEmailEntryList:
            items:
                $ref: '#/components/schemas/BulkEmailEntry'
            type: array
        BulkEmailEntryResult:
            description: The result of the SendBulkEmail operation of each specified BulkEmailEntry .
            properties:
                Error:
                    $ref: '#/components/schemas/ErrorMessage'
                    description: A description of an error that prevented a message being sent using the SendBulkTemplatedEmail operation.
                MessageId:
                    $ref: '#/components/schemas/OutboundMessageId'
                    description: The unique message identifier returned from the SendBulkTemplatedEmail operation.
                Status:
                    $ref: '#/components/schemas/BulkEmailStatus'
                    description: 'The status of a message sent using the SendBulkTemplatedEmail operation. Possible values for this parameter include: SUCCESS: Amazon SES accepted the message, and will attempt to deliver it to the recipients. MESSAGE_REJECTED: The message was rejected because it contained a virus. MAIL_FROM_DOMAIN_NOT_VERIFIED: The sender''s email address or domain was not verified. CONFIGURATION_SET_DOES_NOT_EXIST: The configuration set you specified does not exist. TEMPLATE_DOES_NOT_EXIST: The template you specified does not exist. ACCOUNT_SUSPENDED: Your account has been shut down because of issues related to your email sending practices. ACCOUNT_THROTTLED: The number of emails you can send has been reduced because your account has exceeded its allocated sending limit. ACCOUNT_DAILY_QUOTA_EXCEEDED: You have reached or exceeded the maximum number of emails you can send from your account in a 24-hour period. INVALID_SENDING_POOL_NAME: The configuration set you specified refers to an IP pool that does not exist. ACCOUNT_SENDING_PAUSED: Email sending for the Amazon SES account was disabled using the UpdateAccountSendingEnabled operation. CONFIGURATION_SET_SENDING_PAUSED: Email sending for this configuration set was disabled using the UpdateConfigurationSetSendingEnabled operation. INVALID_PARAMETER_VALUE: One or more of the parameters you specified when calling this operation was invalid. See the error message for additional information. TRANSIENT_FAILURE: Amazon SES was unable to process your request because of a temporary issue. FAILED: Amazon SES was unable to process your request. See the error message for additional information.'
            type: object
        BulkEmailEntryResultList:
            items:
                $ref: '#/components/schemas/BulkEmailEntryResult'
            type: array
        BulkEmailStatus:
            enum:
                - ACCOUNT_DAILY_QUOTA_EXCEEDED
                - ACCOUNT_SENDING_PAUSED
                - ACCOUNT_SUSPENDED
                - ACCOUNT_THROTTLED
                - CONFIGURATION_SET_NOT_FOUND
                - CONFIGURATION_SET_SENDING_PAUSED
