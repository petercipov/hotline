                EmailAddress:
                    $ref: '#/components/schemas/EmailAddress'
                    description: The email address that's on the suppression list for your account or for a specific tenant.
                LastUpdateTime:
                    $ref: '#/components/schemas/Timestamp'
                    description: The date and time when the suppressed destination was last updated, shown in Unix time format.
                Reason:
                    $ref: '#/components/schemas/SuppressionListReason'
                    description: The reason that the address was added to the suppression list for your account or for a specific tenant.
            required:
                - EmailAddress
                - LastUpdateTime
                - Reason
            type: object
        SuppressionAttributes:
            description: An object that contains information about the email address suppression preferences for your account in the current Amazon Web Services Region.
            properties:
                SuppressedReasons:
                    $ref: '#/components/schemas/SuppressionListReasons'
                    description: 'A list that contains the reasons that email addresses will be automatically added to the suppression list for your account. This list can contain any or all of the following: COMPLAINT – Amazon SES adds an email address to the suppression list for your account when a message sent to that address results in a complaint. BOUNCE – Amazon SES adds an email address to the suppression list for your account when a message sent to that address results in a hard bounce.'
                ValidationAttributes:
                    $ref: '#/components/schemas/SuppressionValidationAttributes'
            type: object
        SuppressionConditionThreshold:
            description: Contains Auto Validation settings, allowing you to suppress sending to specific destination(s) if they do not meet required threshold. For details on Auto Validation, see Auto Validation .
            properties:
                ConditionThresholdEnabled:
                    $ref: '#/components/schemas/FeatureStatus'
                    description: Indicates whether Auto Validation is enabled for suppression. Set to ENABLED to enable the Auto Validation feature, or set to DISABLED to disable it.
                OverallConfidenceThreshold:
                    $ref: '#/components/schemas/SuppressionConfidenceThreshold'
                    description: The overall confidence threshold used to determine suppression decisions.
            required:
                - ConditionThresholdEnabled
            type: object
        SuppressionConfidenceThreshold:
            description: Contains the confidence threshold settings for Auto Validation.
            properties:
