                    description: Enables or disables the automatic warm-up feature for dedicated IP addresses that are associated with your Amazon SES account in the current Amazon Web Services Region. Set to true to enable the automatic warm-up feature, or set to false to disable it.
            type: object
        PutAccountDetailsRequest:
            properties:
                AdditionalContactEmailAddresses:
                    $ref: '#/components/schemas/AdditionalContactEmailAddresses'
                    description: Additional email addresses that you would like to be notified regarding Amazon SES matters.
                ContactLanguage:
                    $ref: '#/components/schemas/ContactLanguage'
                    description: The language you would prefer to be contacted with.
                MailType:
                    $ref: '#/components/schemas/MailType'
                    description: The type of email your account will send.
                ProductionAccessEnabled:
                    $ref: '#/components/schemas/EnabledWrapper'
                    description: Indicates whether or not your account should have production access in the current Amazon Web Services Region. If the value is false , then your account is in the sandbox . When your account is in the sandbox, you can only send email to verified identities. If the value is true , then your account has production access. When your account has production access, you can send email to any address. The sending quota and maximum sending rate for your account vary based on your specific use case.
                UseCaseDescription:
                    $ref: '#/components/schemas/UseCaseDescription'
                    description: A description of the types of email that you plan to send.
                WebsiteURL:
                    $ref: '#/components/schemas/WebsiteURL'
                    description: The URL of your website. This information helps us better understand the type of content that you plan to send.
            required:
                - MailType
                - WebsiteURL
            type: object
        PutAccountPricingAttributesRequest:
            properties:
                Plan:
                    $ref: '#/components/schemas/PricingPlan'
                    description: 'The pricing plan to apply to your Amazon SES account. For details about each plan, see Amazon SES Pricing . Can be one of the following: NONE ESSENTIALS PRO ENTERPRISE'
            required:
                - Plan
            type: object
        PutAccountSendingAttributesRequest:
            properties:
                SendingEnabled:
                    $ref: '#/components/schemas/Enabled'
                    description: Enables or disables your account's ability to send email. Set to true to enable email sending, or set to false to disable email sending. If Amazon Web Services paused your account's ability to send email, you can't use this operation to resume your account's ability to send email.
            type: object
        PutAccountSuppressionAttributesRequest:
            properties:
                SuppressedReasons:
                    $ref: '#/components/schemas/SuppressionListReasons'
                    description: 'A list that contains the reasons that email addresses will be automatically added to the suppression list for your account. This list can contain any or all of the following: COMPLAINT – Amazon SES adds an email address to the suppression list for your account when a message sent to that address results in a complaint. BOUNCE – Amazon SES adds an email address to the suppression list for your account when a message sent to that address results in a hard bounce.'
                ValidationAttributes:
                    $ref: '#/components/schemas/SuppressionValidationAttributes'
                    description: An object that contains additional suppression attributes for your account.
            type: object
        PutAccountVdmAttributesRequest:
            properties:
                VdmAttributes:
                    $ref: '#/components/schemas/VdmAttributes'
                    description: The VDM attributes that you wish to apply to your Amazon SES account.
            required:
                - VdmAttributes
            type: object
        PutConfigurationSetArchivingOptionsRequest:
            properties:
                ArchiveArn:
                    $ref: '#/components/schemas/ArchiveArn'
                    description: The Amazon Resource Name (ARN) of the MailManager archive that the Amazon SES API v2 sends email to.
            type: object
        PutConfigurationSetDeliveryOptionsRequest:
            properties:
                MaxDeliverySeconds:
                    $ref: '#/components/schemas/MaxDeliverySeconds'
                    description: The maximum amount of time, in seconds, that Amazon SES API v2 will attempt delivery of email. If specified, the value must greater than or equal to 300 seconds (5 minutes) and less than or equal to 50400 seconds (840 minutes).
                SendingPoolName:
                    $ref: '#/components/schemas/SendingPoolName'
                    description: The name of the dedicated IP pool to associate with the configuration set.
                TlsPolicy:
                    $ref: '#/components/schemas/TlsPolicy'
                    description: Specifies whether messages that use the configuration set are required to use Transport Layer Security (TLS). If the value is Require , messages are only delivered if a TLS connection can be established. If the value is Optional , messages can be delivered in plain text if a TLS connection can't be established.
            type: object
        PutConfigurationSetReputationOptionsRequest:
            properties:
                ReputationMetricsEnabled:
                    $ref: '#/components/schemas/Enabled'
                    description: If true , tracking of reputation metrics is enabled for the configuration set. If false , tracking of reputation metrics is disabled for the configuration set.
            type: object
        PutConfigurationSetSendingOptionsRequest:
            properties:
                SendingEnabled:
                    $ref: '#/components/schemas/Enabled'
                    description: If true , email sending is enabled for the configuration set. If false , email sending is disabled for the configuration set.
            type: object
        PutConfigurationSetSuppressionOptionsRequest:
            properties:
                SuppressedReasons:
                    $ref: '#/components/schemas/SuppressionListReasons'
                    description: 'A list that contains the reasons that email addresses are automatically added to the suppression list for your account or for a specific tenant. This list can contain any or all of the following: COMPLAINT – Amazon SES adds an email address to the suppression list for your account or for a specific tenant when a message sent to that address results in a complaint. BOUNCE – Amazon SES adds an email address to the suppression list for your account or for a specific tenant when a message sent to that address results in a hard bounce.'
                SuppressionScope:
                    $ref: '#/components/schemas/SuppressionListScope'
                    description: 'The suppression scope for the configuration set. This overrides the tenant or account suppression scope for emails sent using this configuration set. Can be one of the following: TENANT – Use the tenant''s suppression list. ACCOUNT – Use the account-level suppression list.'
                ValidationOptions:
                    $ref: '#/components/schemas/SuppressionValidationOptions'
                    description: An object that contains information about the email address suppression preferences for the configuration set in the current Amazon Web Services Region.
            type: object
        PutConfigurationSetTrackingOptionsRequest:
            properties:
                CustomRedirectDomain:
                    $ref: '#/components/schemas/CustomRedirectDomain'
                    description: The domain to use to track open and click events.
                HttpsPolicy:
                    $ref: '#/components/schemas/HttpsPolicy'
            type: object
        PutConfigurationSetVdmOptionsRequest:
            properties:
                VdmOptions:
                    $ref: '#/components/schemas/VdmOptions'
                    description: The VDM options to apply to the configuration set.
            type: object
        PutDedicatedIpInPoolRequest:
            properties:
                DestinationPoolName:
                    $ref: '#/components/schemas/PoolName'
                    description: The name of the IP pool that you want to add the dedicated IP address to. You have to specify an IP pool that already exists.
            required:
                - DestinationPoolName
            type: object
        PutDedicatedIpPoolScalingAttributesRequest:
            properties:
                ScalingMode:
                    $ref: '#/components/schemas/ScalingMode'
                    description: The scaling mode to apply to the dedicated IP pool. Changing the scaling mode from MANAGED to STANDARD is not supported.
            required:
                - ScalingMode
            type: object
        PutDedicatedIpWarmupAttributesRequest:
            properties:
                WarmupPercentage:
                    $ref: '#/components/schemas/Percentage100Wrapper'
                    description: The warm-up percentage that you want to associate with the dedicated IP address.
            required:
                - WarmupPercentage
            type: object
        PutDeliverabilityDashboardOptionRequest:
            properties:
                DashboardEnabled:
                    $ref: '#/components/schemas/Enabled'
                    description: Specifies whether to enable the Deliverability dashboard. To enable the dashboard, set this value to true .
                SubscribedDomains:
                    $ref: '#/components/schemas/DomainDeliverabilityTrackingOptions'
                    description: An array of objects, one for each verified domain that you use to send email and enabled the Deliverability dashboard for.
            required:
                - DashboardEnabled
            type: object
        PutEmailIdentityConfigurationSetAttributesRequest:
            properties:
                ConfigurationSetName:
                    $ref: '#/components/schemas/ConfigurationSetName'
                    description: The configuration set to associate with an email identity.
            type: object
        PutEmailIdentityDkimAttributesRequest:
            properties:
                SigningEnabled:
                    $ref: '#/components/schemas/Enabled'
                    description: Sets the DKIM signing configuration for the identity. When you set this value true , then the messages that are sent from the identity are signed using DKIM. If you set this value to false , your messages are sent without DKIM signing.
            type: object
        PutEmailIdentityDkimSigningAttributesRequest:
            properties:
                SigningAttributes:
                    $ref: '#/components/schemas/DkimSigningAttributes'
                    description: An object that contains information about the private key and selector that you want to use to configure DKIM for the identity for Bring Your Own DKIM (BYODKIM) for the identity, or, configures the key length to be used for Easy DKIM .
                SigningAttributesOrigin:
                    $ref: '#/components/schemas/DkimSigningAttributesOrigin'
                    description: 'The method to use to configure DKIM for the identity. There are the following possible values: AWS_SES – Configure DKIM for the identity by using Easy DKIM . EXTERNAL – Configure DKIM for the identity by using Bring Your Own DKIM (BYODKIM).'
            required:
                - SigningAttributesOrigin
            type: object
        PutEmailIdentityDkimSigningAttributesResponse:
            properties:
                DkimStatus:
                    $ref: '#/components/schemas/DkimStatus'
                    description: 'The DKIM authentication status of the identity. Amazon SES determines the authentication status by searching for specific records in the DNS configuration for your domain. If you used Easy DKIM to set up DKIM authentication, Amazon SES tries to find three unique CNAME records in the DNS configuration for your domain. If you provided a public key to perform DKIM authentication, Amazon SES tries to find a TXT record that uses the selector that you specified. The value of the TXT record must be a public key that''s paired with the private key that you specified in the process of creating the identity. The status can be one of the following: PENDING – The verification process was initiated, but Amazon SES hasn''t yet detected the DKIM records in the DNS configuration for the domain. SUCCESS – The verification process completed successfully. FAILED – The verification process failed. This typically occurs when Amazon SES fails to find the DKIM records in the DNS configuration of the domain. TEMPORARY_FAILURE – A temporary issue is preventing Amazon SES from determining the DKIM authentication status of the domain. NOT_STARTED – The DKIM verification process hasn''t been initiated for the domain.'
                DkimTokens:
                    $ref: '#/components/schemas/DnsTokenList'
                    description: If you used Easy DKIM to configure DKIM authentication for the domain, then this object contains a set of unique strings that you use to create a set of CNAME records that you add to the DNS configuration for your domain. When Amazon SES detects these records in the DNS configuration for your domain, the DKIM authentication process is complete. If you configured DKIM authentication for the domain by providing your own public-private key pair, then this object contains the selector that's associated with your public key. Regardless of the DKIM authentication method you use, Amazon SES searches for the appropriate records in the DNS configuration of the domain for up to 72 hours.
                SigningHostedZone:
                    $ref: '#/components/schemas/HostedZone'
                    description: 'The hosted zone where Amazon SES publishes the DKIM public key TXT records for this email identity. This value indicates the DNS zone that customers must reference when configuring their CNAME records for DKIM authentication. When configuring DKIM for your domain, create CNAME records in your DNS that point to the selectors in this hosted zone. For example: selector1._domainkey.yourdomain.com CNAME selector1. selector2._domainkey.yourdomain.com CNAME selector2. selector3._domainkey.yourdomain.com CNAME selector3.'
            type: object
        PutEmailIdentityFeedbackAttributesRequest:
            properties:
                EmailForwardingEnabled:
                    $ref: '#/components/schemas/Enabled'
                    description: Sets the feedback forwarding configuration for the identity. If the value is true , you receive email notifications when bounce or complaint events occur. These notifications are sent to the address that you specified in the Return-Path header of the original email. You're required to have a method of tracking bounces and complaints. If you haven't set up another mechanism for receiving bounce or complaint notifications (for example, by setting up an event destination), you receive an email notification when these events occur (even if this setting is disabled).
            type: object
        PutEmailIdentityMailFromAttributesRequest:
            properties:
                BehaviorOnMxFailure:
                    $ref: '#/components/schemas/BehaviorOnMxFailure'
                    description: The action to take if the required MX record isn't found when you send an email. When you set this value to UseDefaultValue , the mail is sent using amazonses.com as the MAIL FROM domain. When you set this value to RejectMessage , the Amazon SES API v2 returns a MailFromDomainNotVerified error, and doesn't attempt to deliver the email. These behaviors are taken when the custom MAIL FROM domain configuration is in the Pending , Failed , and TemporaryFailure states.
                MailFromDomain:
                    $ref: '#/components/schemas/MailFromDomainName'
                    description: 'The custom MAIL FROM domain that you want the verified identity to use. The MAIL FROM domain must meet the following criteria: It has to be a subdomain of the verified identity. It can''t be used to receive email. It can''t be used in a "From" address if the MAIL FROM domain is a destination for feedback forwarding emails.'
            type: object
        PutSuppressedDestinationRequest:
            properties:
                EmailAddress:
                    $ref: '#/components/schemas/EmailAddress'
                    description: The email address that should be added to the suppression list for your account or for the specified tenant.
                Reason:
                    $ref: '#/components/schemas/SuppressionListReason'
                    description: The factors that should cause the email address to be added to the suppression list for your account or for the specified tenant.
                TenantName:
                    $ref: '#/components/schemas/TenantName'
                    description: The name of the tenant whose suppression list you want to add the address to. If you omit this parameter, the address is added to the account-level suppression list.
            required:
                - EmailAddress
                - Reason
            type: object
        PutTenantSuppressionAttributesRequest:
            properties:
                SuppressedReasons:
                    $ref: '#/components/schemas/SuppressionListReasons'
                    description: 'A list that contains the reasons that email addresses are automatically added to the suppression list for the tenant. This list can contain any or all of the following: COMPLAINT – Amazon SES adds an email address to the suppression list when a message sent to that address results in a complaint. BOUNCE – Amazon SES adds an email address to the suppression list when a message sent to that address results in a hard bounce.'
                SuppressionScope:
                    $ref: '#/components/schemas/SuppressionListScope'
                    description: The suppression scope for the tenant. Specify TENANT to use the tenant's own suppression list, or ACCOUNT to use the account-level suppression list. If you don't specify a suppression scope, the tenant defaults to ACCOUNT scope and uses the account-level suppression list.
                TenantName:
                    $ref: '#/components/schemas/TenantName'
                    description: The name of the tenant to configure suppression list preferences for.
            required:
                - TenantName
            type: object
        QueryErrorCode:
            enum:
                - ACCESS_DENIED
                - INTERNAL_FAILURE
            type: string
        QueryErrorMessage:
            type: string
        QueryIdentifier:
            maxLength: 255
            minLength: 1
            type: string
        RawAttachmentData:
            contentEncoding: base64
            type: string
        RawMessage:
            description: Represents the raw content of an email message.
            properties:
                Data:
                    $ref: '#/components/schemas/RawMessageData'
                    description: 'The raw email message. The message has to meet the following criteria: The message has to contain a header and a body, separated by one blank line. All of the required header fields must be present in the message. Each part of a multipart MIME message must be formatted properly. Attachments must be in a file format that the Amazon SES supports. The raw data of the message needs to base64-encoded if you are accessing Amazon SES directly through the HTTPS interface. If you are accessing Amazon SES using an Amazon Web Services SDK, the SDK takes care of the base 64-encoding for you. If any of the MIME parts in your message contain content that is outside of the 7-bit ASCII character range, you should encode that content to ensure that recipients'' email clients render the message properly. The length of any single line of text in the message can''t exceed 1,000 characters. This restriction is defined in RFC 5321 .'
            required:
                - Data
            type: object
        RawMessageData:
            contentEncoding: base64
            type: string
        RblName:
            type: string
        Recommendation:
            description: A recommendation generated for your account.
            properties:
                CreatedTimestamp:
                    $ref: '#/components/schemas/Timestamp'
                    description: The first time this issue was encountered and the recommendation was generated.
                Description:
                    $ref: '#/components/schemas/RecommendationDescription'
                    description: The recommendation description / disambiguator - e.g. DKIM1 and DKIM2 are different recommendations about your DKIM setup.
                Impact:
                    $ref: '#/components/schemas/RecommendationImpact'
                    description: The recommendation impact, with values like HIGH or LOW .
                LastUpdatedTimestamp:
                    $ref: '#/components/schemas/Timestamp'
                    description: The last time the recommendation was updated.
                ResourceArn:
                    $ref: '#/components/schemas/AmazonResourceName'
                    description: The resource affected by the recommendation, with values like arn:aws:ses:us-east-1:123456789012:identity/example.com .
                Status:
                    $ref: '#/components/schemas/RecommendationStatus'
                    description: The recommendation status, with values like OPEN or FIXED .
                Type:
                    $ref: '#/components/schemas/RecommendationType'
                    description: The recommendation type, with values like DKIM , SPF , DMARC , BIMI , or COMPLAINT .
            type: object
        RecommendationDescription:
            type: string
        RecommendationImpact:
            enum:
                - HIGH
                - LOW
            type: string
        RecommendationStatus:
            enum:
                - FIXED
                - OPEN
            type: string
        RecommendationType:
            enum:
                - BIMI
                - BOUNCE
                - COMPLAINT
                - DKIM
                - DMARC
                - FEEDBACK_3P
                - IP_LISTING
                - SPF
            type: string
        RecommendationsList:
            items:
                $ref: '#/components/schemas/Recommendation'
            type: array
        Region:
            type: string
        Regions:
            items:
                $ref: '#/components/schemas/Region'
            type: array
        RenderedEmailTemplate:
            type: string
        ReplacementEmailContent:
            description: The ReplaceEmailContent object to be used for a specific BulkEmailEntry . The ReplacementTemplate can be specified within this object.
            properties:
                ReplacementTemplate:
                    $ref: '#/components/schemas/ReplacementTemplate'
                    description: The ReplacementTemplate associated with ReplacementEmailContent .
            type: object
        ReplacementTemplate:
            description: An object which contains ReplacementTemplateData to be used for a specific BulkEmailEntry .
            properties:
                ReplacementTemplateData:
                    $ref: '#/components/schemas/EmailTemplateData'
                    description: A list of replacement values to apply to the template. This parameter is a JSON object, typically consisting of key-value pairs in which the keys correspond to replacement tags in the email template.
            type: object
        ReportId:
            type: string
        ReportName:
            type: string
        ReputationEntitiesList:
            items:
                $ref: '#/components/schemas/ReputationEntity'
            type: array
        ReputationEntity:
            description: An object that contains information about a reputation entity, including its reference, type, policy, status records, and reputation impact.
            properties:
                AwsSesManagedStatus:
                    $ref: '#/components/schemas/StatusRecord'
                    description: The Amazon Web Services Amazon SES-managed status record for this reputation entity, including the current status, cause description, and last updated timestamp.
                CustomerManagedStatus:
                    $ref: '#/components/schemas/StatusRecord'
                    description: The customer-managed status record for this reputation entity, including the current status, cause description, and last updated timestamp.
                ReputationEntityReference:
                    $ref: '#/components/schemas/ReputationEntityReference'
                    description: The unique identifier for the reputation entity. For resource-type entities, this is the Amazon Resource Name (ARN) of the resource.
                ReputationEntityType:
                    $ref: '#/components/schemas/ReputationEntityType'
                    description: The type of reputation entity. Currently, only RESOURCE type entities are supported.
                ReputationImpact:
                    $ref: '#/components/schemas/RecommendationImpact'
                    description: The reputation impact level for this entity, representing the highest impact reputation finding currently active. Reputation findings can be retrieved using the ListRecommendations operation.
                ReputationManagementPolicy:
                    $ref: '#/components/schemas/AmazonResourceName'
                    description: The Amazon Resource Name (ARN) of the reputation management policy applied to this entity. This is an Amazon Web Services Amazon SES-managed policy.
                SendingStatusAggregate:
                    $ref: '#/components/schemas/SendingStatus'
                    description: The aggregate sending status that determines whether the entity is allowed to send emails. This status is derived from both the customer-managed and Amazon Web Services Amazon SES-managed statuses. If either the customer-managed status or the Amazon Web Services Amazon SES-managed status is DISABLED , the aggregate status will be DISABLED and the entity will not be allowed to send emails. When the customer-managed status is set to REINSTATED , the entity can continue sending even if there are active reputation findings, provided the Amazon Web Services Amazon SES-managed status also permits sending. The entity can only send emails when both statuses permit sending.
            type: object
        ReputationEntityFilter:
            additionalProperties:
                $ref: '#/components/schemas/ReputationEntityFilterValue'
            type: object
        ReputationEntityFilterValue:
            maxLength: 512
            minLength: 1
            type: string
        ReputationEntityReference:
            minLength: 1
            type: string
        ReputationEntityType:
            enum:
                - RESOURCE
            type: string
        ReputationOptions:
            description: Enable or disable collection of reputation metrics for emails that you send using this configuration set in the current Amazon Web Services Region.
            properties:
                LastFreshStart:
                    $ref: '#/components/schemas/LastFreshStart'
                    description: The date and time (in Unix time) when the reputation metrics were last given a fresh start. When your account is given a fresh start, your reputation metrics are calculated starting from the date of the fresh start.
                ReputationMetricsEnabled:
                    $ref: '#/components/schemas/Enabled'
                    description: If true , tracking of reputation metrics is enabled for the configuration set. If false , tracking of reputation metrics is disabled for the configuration set.
            type: object
        ResourceTenantMetadata:
