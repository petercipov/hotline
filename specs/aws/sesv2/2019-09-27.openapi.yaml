            type: array
        TrackingConfigurationOverrides:
            description: An object that overrides, for a single email sending request, the engagement tracking settings that would otherwise apply. Use these overrides to turn open tracking or click tracking on or off for an individual message, for example to suppress tracking in a transactional message that you send from an account or a configuration set that has tracking enabled. Without an override, engagement tracking is determined by your account-level EngagementMetrics setting, which you configure using the PutAccountVdmAttributes operation, by the EngagementMetrics setting of the configuration set that the message uses, which you configure using the PutConfigurationSetVdmOptions operation, and by whether that configuration set has an event destination whose MatchingEventTypes include the OPEN or CLICK event types. For more information about tracking open and click events, see the Amazon SES Developer Guide .
            properties:
                ClickTrackingEnabled:
                    $ref: '#/components/schemas/FeatureStatus'
                    description: 'Specifies whether Amazon SES tracks when the recipient clicks a link in this message. Can be one of the following: ENABLED – Amazon SES tracks clicks for this message, even when your account-level and configuration set settings don''t enable click tracking. DISABLED – Amazon SES doesn''t track clicks for this message, even when your account-level or configuration set settings enable click tracking. Amazon SES doesn''t rewrite the links in the message. If you don''t specify this value, Amazon SES uses the click tracking setting that would otherwise apply to the message. Enabling open or click tracking with an override doesn''t create an event destination. Amazon SES records the resulting open and click events in VDM, where you can review them using VDM metrics and Message Insights. To also receive these events at a destination that you own, the configuration set that the message uses must have an event destination that publishes open and click events.'
                OpenTrackingEnabled:
                    $ref: '#/components/schemas/FeatureStatus'
                    description: 'Specifies whether Amazon SES tracks when the recipient opens this message. Can be one of the following: ENABLED – Amazon SES tracks opens for this message, even when your account-level and configuration set settings don''t enable open tracking. DISABLED – Amazon SES doesn''t track opens for this message, even when your account-level or configuration set settings enable open tracking. Amazon SES doesn''t add the tracking image to the message. If you don''t specify this value, Amazon SES uses the open tracking setting that would otherwise apply to the message.'
            type: object
        TrackingOptions:
            description: An object that defines the tracking options for a configuration set. When you use the Amazon SES API v2 to send an email, it contains an invisible image that's used to track when recipients open your email. If your email contains links, those links are changed slightly in order to track when recipients click them. These images and links include references to a domain operated by Amazon Web Services. You can optionally configure the Amazon SES to use a domain that you operate for these images and links.
            properties:
                CustomRedirectDomain:
                    $ref: '#/components/schemas/CustomRedirectDomain'
                    description: The domain to use for tracking open and click events.
                HttpsPolicy:
                    $ref: '#/components/schemas/HttpsPolicy'
                    description: The https policy to use for tracking open and click events.
            required:
                - CustomRedirectDomain
            type: object
        UnsubscribeAll:
            type: boolean
        UpdateConfigurationSetEventDestinationRequest:
            properties:
                EventDestination:
                    $ref: '#/components/schemas/EventDestinationDefinition'
                    description: An object that defines the event destination.
            required:
                - EventDestination
            type: object
        UpdateConfigurationSetRequest:
            properties:
                ConfigurationSetName:
                    $ref: '#/components/schemas/ConfigurationSetName'
                    description: The name of the configuration set to update.
                MessageSecurityOptions:
                    $ref: '#/components/schemas/MessageSecurityOptions'
                    description: The security options that apply to the MIME message itself for messages sent with the configuration set.
            required:
                - ConfigurationSetName
            type: object
        UpdateContactListRequest:
            properties:
                Description:
                    $ref: '#/components/schemas/Description'
                    description: A description of what the contact list is about.
                Topics:
                    $ref: '#/components/schemas/Topics'
                    description: An interest group, theme, or label within a list. A contact list can have multiple topics.
            type: object
        UpdateContactRequest:
            properties:
                AttributesData:
                    $ref: '#/components/schemas/AttributesData'
                    description: The attribute data attached to a contact.
                TopicPreferences:
                    $ref: '#/components/schemas/TopicPreferenceList'
                    description: The contact's preference for being opted-in to or opted-out of a topic.
                UnsubscribeAll:
                    $ref: '#/components/schemas/UnsubscribeAll'
                    description: A boolean value status noting if the contact is unsubscribed from all contact list topics.
            type: object
        UpdateCustomVerificationEmailTemplateRequest:
            properties:
                FailureRedirectionURL:
                    $ref: '#/components/schemas/FailureRedirectionURL'
                    description: The URL that the recipient of the verification email is sent to if his or her address is not successfully verified.
                FromEmailAddress:
                    $ref: '#/components/schemas/EmailAddress'
                    description: The email address that the custom verification email is sent from.
                SuccessRedirectionURL:
                    $ref: '#/components/schemas/SuccessRedirectionURL'
                    description: The URL that the recipient of the verification email is sent to if his or her address is successfully verified.
                TemplateContent:
                    $ref: '#/components/schemas/TemplateContent'
                    description: The content of the custom verification email. The total size of the email must be less than 10 MB. The message body may contain HTML, with some limitations. For more information, see Custom verification email frequently asked questions in the Amazon SES Developer Guide .
                TemplateSubject:
                    $ref: '#/components/schemas/EmailTemplateSubject'
                    description: The subject line of the custom verification email.
            required:
                - FailureRedirectionURL
                - FromEmailAddress
                - SuccessRedirectionURL
                - TemplateContent
                - TemplateSubject
            type: object
        UpdateEmailIdentityPolicyRequest:
            properties:
                Policy:
                    $ref: '#/components/schemas/Policy'
                    description: The text of the policy in JSON format. The policy cannot exceed 4 KB. For information about the syntax of sending authorization policies, see the Amazon SES Developer Guide .
            required:
                - Policy
            type: object
        UpdateEmailTemplateRequest:
            properties:
                TemplateContent:
                    $ref: '#/components/schemas/EmailTemplateContent'
                    description: The content of the email template, composed of a subject line, an HTML part, and a text-only part.
            required:
                - TemplateContent
            type: object
        UpdateReputationEntityCustomerManagedStatusRequest:
            properties:
                SendingStatus:
                    $ref: '#/components/schemas/SendingStatus'
                    description: 'The new customer-managed sending status for the reputation entity. This can be one of the following: ENABLED – Allow sending for this entity. DISABLED – Prevent sending for this entity. REINSTATED – Allow sending even if there are active reputation findings.'
            required:
                - SendingStatus
            type: object
        UpdateReputationEntityPolicyRequest:
            properties:
                ReputationEntityPolicy:
                    $ref: '#/components/schemas/AmazonResourceName'
                    description: The Amazon Resource Name (ARN) of the reputation management policy to apply to this entity. This is an Amazon Web Services Amazon SES-managed policy.
            required:
                - ReputationEntityPolicy
            type: object
        UseCaseDescription:
            maxLength: 5000
            minLength: 0
            type: string
        UseDefaultIfPreferenceUnavailable:
            type: boolean
        VdmAttributes:
            description: The VDM attributes that apply to your Amazon SES account.
            properties:
                DashboardAttributes:
                    $ref: '#/components/schemas/DashboardAttributes'
                    description: Specifies additional settings for your VDM configuration as applicable to the Dashboard.
                GuardianAttributes:
                    $ref: '#/components/schemas/GuardianAttributes'
                    description: Specifies additional settings for your VDM configuration as applicable to the Guardian.
                VdmEnabled:
                    $ref: '#/components/schemas/FeatureStatus'
                    description: 'Specifies the status of your VDM configuration. Can be one of the following: ENABLED – Amazon SES enables VDM for your account. DISABLED – Amazon SES disables VDM for your account.'
            required:
                - VdmEnabled
            type: object
        VdmOptions:
            description: An object that defines the VDM settings that apply to emails that you send using the configuration set.
            properties:
                DashboardOptions:
                    $ref: '#/components/schemas/DashboardOptions'
                    description: Specifies additional settings for your VDM configuration as applicable to the Dashboard.
                GuardianOptions:
                    $ref: '#/components/schemas/GuardianOptions'
                    description: Specifies additional settings for your VDM configuration as applicable to the Guardian.
            type: object
        VerificationError:
            enum:
                - DNS_SERVER_ERROR
                - HOST_NOT_FOUND
                - INVALID_VALUE
                - REPLICATION_ACCESS_DENIED
                - REPLICATION_PRIMARY_BYO_DKIM_NOT_SUPPORTED
                - REPLICATION_PRIMARY_INVALID_REGION
                - REPLICATION_PRIMARY_NOT_FOUND
                - REPLICATION_REPLICA_AS_PRIMARY_NOT_SUPPORTED
                - SERVICE_ERROR
                - TYPE_NOT_FOUND
            type: string
        VerificationInfo:
            description: An object that contains additional information about the verification status for the identity.
            properties:
                ErrorType:
                    $ref: '#/components/schemas/VerificationError'
                    description: 'Provides the reason for the failure describing why Amazon SES was not able to successfully verify the identity. Below are the possible values: INVALID_VALUE – Amazon SES was able to find the record, but the value contained within the record was invalid. Ensure you have published the correct values for the record. TYPE_NOT_FOUND – The queried hostname exists but does not have the requested type of DNS record. Ensure that you have published the correct type of DNS record. HOST_NOT_FOUND – The queried hostname does not exist or was not reachable at the time of the request. Ensure that you have published the required DNS record(s). SERVICE_ERROR – A temporary issue is preventing Amazon SES from determining the verification status of the domain. DNS_SERVER_ERROR – The DNS server encountered an issue and was unable to complete the request. REPLICATION_ACCESS_DENIED – The verification failed because the user does not have the required permissions to replicate the DKIM key from the primary region. Ensure you have the necessary permissions in both primary and replica regions. REPLICATION_PRIMARY_NOT_FOUND – The verification failed because no corresponding identity was found in the specified primary region. Ensure the identity exists in the primary region before attempting replication. REPLICATION_PRIMARY_BYO_DKIM_NOT_SUPPORTED – The verification failed because the identity in the primary region is configured with Bring Your Own DKIM (BYODKIM). DKIM key replication is only supported for identities using Easy DKIM. REPLICATION_REPLICA_AS_PRIMARY_NOT_SUPPORTED – The verification failed because the specified primary identity is a replica of another identity, and multi-level replication is not supported; the primary identity must be a non-replica identity. REPLICATION_PRIMARY_INVALID_REGION – The verification failed due to an invalid primary region specified. Ensure you provide a valid Amazon Web Services region where Amazon SES is available and different from the replica region.'
                LastCheckedTimestamp:
                    $ref: '#/components/schemas/Timestamp'
                    description: The last time a verification attempt was made for this identity.
                LastSuccessTimestamp:
                    $ref: '#/components/schemas/Timestamp'
                    description: The last time a successful verification was made for this identity.
                SOARecord:
                    $ref: '#/components/schemas/SOARecord'
                    description: An object that contains information about the start of authority (SOA) record associated with the identity.
            type: object
        VerificationStatus:
            enum:
                - FAILED
                - NOT_STARTED
                - PENDING
                - SUCCESS
                - TEMPORARY_FAILURE
            type: string
        Volume:
            format: int64
            type: integer
        VolumeStatistics:
            description: An object that contains information about the amount of email that was delivered to recipients.
            properties:
                InboxRawCount:
                    $ref: '#/components/schemas/Volume'
                    description: The total number of emails that arrived in recipients' inboxes.
                ProjectedInbox:
                    $ref: '#/components/schemas/Volume'
                    description: An estimate of the percentage of emails sent from the current domain that will arrive in recipients' inboxes.
                ProjectedSpam:
                    $ref: '#/components/schemas/Volume'
                    description: An estimate of the percentage of emails sent from the current domain that will arrive in recipients' spam or junk mail folders.
                SpamRawCount:
                    $ref: '#/components/schemas/Volume'
                    description: The total number of emails that arrived in recipients' spam or junk mail folders.
            type: object
        WarmupStatus:
            enum:
                - DONE
                - IN_PROGRESS
                - NOT_APPLICABLE
            type: string
        WebsiteURL:
            maxLength: 1000
            minLength: 1
            pattern: ^(([^:/?#]+):)?(//([^/?#]*))?([^?#]*)(\?([^#]*))?(#(.*))?$
            type: string
    securitySchemes:
        aws_sigv4:
            in: header
            name: Authorization
            type: apiKey
