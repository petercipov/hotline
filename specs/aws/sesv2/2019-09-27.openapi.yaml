                ResourceArn:
                    $ref: '#/components/schemas/AmazonResourceName'
                    description: The Amazon Resource Name (ARN) of the resource.
                TenantId:
                    $ref: '#/components/schemas/TenantId'
                    description: A unique identifier for the tenant associated with the resource.
                TenantName:
                    $ref: '#/components/schemas/TenantName'
                    description: The name of the tenant associated with the resource.
            type: object
        ResourceTenantMetadataList:
            items:
                $ref: '#/components/schemas/ResourceTenantMetadata'
            type: array
        ResourceType:
            enum:
                - CONFIGURATION_SET
                - EMAIL_IDENTITY
                - EMAIL_TEMPLATE
            type: string
        ReviewDetails:
            description: An object that contains information about your account details review.
            properties:
                CaseId:
                    $ref: '#/components/schemas/CaseId'
                    description: The associated support center case ID (if any).
                Status:
                    $ref: '#/components/schemas/ReviewStatus'
                    description: 'The status of the latest review of your account. The status can be one of the following: PENDING – We have received your appeal and are in the process of reviewing it. GRANTED – Your appeal has been reviewed and your production access has been granted. DENIED – Your appeal has been reviewed and your production access has been denied. FAILED – An internal error occurred and we didn''t receive your appeal. You can submit your appeal again.'
            type: object
        ReviewStatus:
            enum:
                - DENIED
                - FAILED
                - GRANTED
                - PENDING
            type: string
        Route:
