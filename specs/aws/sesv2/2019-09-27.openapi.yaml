            properties:
                Region:
                    $ref: '#/components/schemas/Region'
                    description: The name of an AWS-Region.
            required:
                - Region
            type: object
        RouteDetails:
            description: An object that contains route configuration. Includes secondary region name.
            properties:
                Region:
                    $ref: '#/components/schemas/Region'
                    description: The name of an AWS-Region to be a secondary region for the multi-region endpoint (global-endpoint).
            required:
                - Region
            type: object
        Routes:
            items:
                $ref: '#/components/schemas/Route'
            type: array
        RoutesDetails:
            items:
                $ref: '#/components/schemas/RouteDetails'
            type: array
        S3Url:
