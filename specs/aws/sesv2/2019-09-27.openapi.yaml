        SuppressionListDestination:
            description: An object that contains details about the action of suppression list.
            properties:
                SuppressionListImportAction:
                    $ref: '#/components/schemas/SuppressionListImportAction'
                    description: 'The type of action to perform on the address. The following are possible values: PUT: add the addresses to the suppression list. If the record already exists, it will override it with the new value. DELETE: remove the addresses from the suppression list.'
            required:
                - SuppressionListImportAction
