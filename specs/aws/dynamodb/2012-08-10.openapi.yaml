        PointInTimeRecoveryDescription:
            description: The description of the point in time settings applied to the table.
            properties:
                EarliestRestorableDateTime:
                    $ref: '#/components/schemas/Date'
                    description: Specifies the earliest point in time you can restore your table to. You can restore your table to any point in time during the last 35 days.
                LatestRestorableDateTime:
                    $ref: '#/components/schemas/Date'
                    description: LatestRestorableDateTime is typically 5 minutes before the current time.
                PointInTimeRecoveryStatus:
                    $ref: '#/components/schemas/PointInTimeRecoveryStatus'
                    description: 'The current state of point in time recovery: ENABLED - Point in time recovery is enabled. DISABLED - Point in time recovery is disabled.'
                RecoveryPeriodInDays:
                    $ref: '#/components/schemas/RecoveryPeriodInDays'
                    description: The number of preceding days for which continuous backups are taken and maintained. Your table data is only recoverable to any point-in-time from within the configured recovery period. This parameter is optional.
            type: object
        PointInTimeRecoverySpecification:
            description: Represents the settings used to enable point in time recovery.
            properties:
                PointInTimeRecoveryEnabled:
                    $ref: '#/components/schemas/BooleanObject'
                    description: Indicates whether point in time recovery is enabled (true) or disabled (false) on the table.
                RecoveryPeriodInDays:
                    $ref: '#/components/schemas/RecoveryPeriodInDays'
                    description: The number of preceding days for which continuous backups are taken and maintained. Your table data is only recoverable to any point-in-time from within the configured recovery period. This parameter is optional. If no value is provided, the value will default to 35.
            required:
                - PointInTimeRecoveryEnabled
