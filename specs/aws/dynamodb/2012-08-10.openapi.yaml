                    description: One or more values that can be substituted in an expression. For more information, see Expression Attribute Values in the Amazon DynamoDB Developer Guide.
                FilterExpression:
                    $ref: '#/components/schemas/ConditionExpression'
                    description: A condition that filters which items are included in the export. This parameter uses the same syntax as FilterExpression in Query and Scan . If you don't provide KeyConditionExpression , this expression can also reference key attributes. If you don't specify this parameter, all items are included in the export.
                KeyConditionExpression:
                    $ref: '#/components/schemas/KeyExpression'
                    description: A condition expression that filters items by key values. The expression must test equality on a single partition key value and can optionally compare a sort key value. This parameter uses the same syntax as KeyConditionExpression in Query . When you provide this parameter, FilterExpression can only reference non-key attributes. If you don't specify this parameter, all items are eligible for export.
                ProjectionExpression:
