components:
    schemas:
        ApproximateCreationDateTimePrecision:
            enum:
                - MICROSECOND
                - MILLISECOND
            type: string
        ArchivalReason:
            type: string
        ArchivalSummary:
            description: Contains details of a table archival operation.
            properties:
                ArchivalBackupArn:
                    $ref: '#/components/schemas/BackupArn'
                    description: The Amazon Resource Name (ARN) of the backup the table was archived to, when applicable in the archival reason. If you wish to restore this backup to the same table name, you will need to delete the original table.
                ArchivalDateTime:
                    $ref: '#/components/schemas/Date'
                    description: The date and time when table archival was initiated by DynamoDB, in UNIX epoch time format.
                ArchivalReason:
                    $ref: '#/components/schemas/ArchivalReason'
                    description: 'The reason DynamoDB archived the table. Currently, the only possible value is: INACCESSIBLE_ENCRYPTION_CREDENTIALS - The table was archived due to the table''s KMS key being inaccessible for more than seven days. An On-Demand backup was created at the archival time.'
            type: object
        AttributeAction:
            enum:
                - ADD
                - DELETE
                - PUT
            type: string
        AttributeDefinition:
            description: Represents an attribute for describing the schema for the table and indexes.
            properties:
                AttributeName:
                    $ref: '#/components/schemas/KeySchemaAttributeName'
                    description: A name for the attribute.
                AttributeType:
                    $ref: '#/components/schemas/ScalarAttributeType'
                    description: 'The data type for the attribute, where: S - the attribute is of type String N - the attribute is of type Number B - the attribute is of type Binary'
            required:
                - AttributeName
                - AttributeType
            type: object
        AttributeDefinitions:
            items:
                $ref: '#/components/schemas/AttributeDefinition'
            type: array
        AttributeMap:
            additionalProperties:
                $ref: '#/components/schemas/AttributeValue'
            type: object
        AttributeName:
            maxLength: 65535
            minLength: 0
            type: string
        AttributeNameList:
            items:
                $ref: '#/components/schemas/AttributeName'
            minItems: 1
            type: array
        AttributeUpdates:
            additionalProperties:
                $ref: '#/components/schemas/AttributeValueUpdate'
            type: object
        AttributeValue:
            maxProperties: 1
            minProperties: 1
            properties:
                B:
                    $ref: '#/components/schemas/BinaryAttributeValue'
                    description: 'An attribute of type Binary. For example: "B": "dGhpcyB0ZXh0IGlzIGJhc2U2NC1lbmNvZGVk"'
                BOOL:
                    $ref: '#/components/schemas/BooleanAttributeValue'
                    description: 'An attribute of type Boolean. For example: "BOOL": true'
                BS:
                    $ref: '#/components/schemas/BinarySetAttributeValue'
                    description: 'An attribute of type Binary Set. For example: "BS": ["U3Vubnk=", "UmFpbnk=", "U25vd3k="]'
                L:
                    $ref: '#/components/schemas/ListAttributeValue'
                    description: 'An attribute of type List. For example: "L": [ {"S": "Cookies"} , {"S": "Coffee"}, {"N": "3.14159"}]'
                M:
                    $ref: '#/components/schemas/MapAttributeValue'
                    description: 'An attribute of type Map. For example: "M": {"Name": {"S": "Joe"}, "Age": {"N": "35"}}'
                "N":
                    $ref: '#/components/schemas/NumberAttributeValue'
                    description: 'An attribute of type Number. For example: "N": "123.45" Numbers are sent across the network to DynamoDB as strings, to maximize compatibility across languages and libraries. However, DynamoDB treats them as number type attributes for mathematical operations.'
                NS:
                    $ref: '#/components/schemas/NumberSetAttributeValue'
                    description: 'An attribute of type Number Set. For example: "NS": ["42.2", "-19", "7.5", "3.14"] Numbers are sent across the network to DynamoDB as strings, to maximize compatibility across languages and libraries. However, DynamoDB treats them as number type attributes for mathematical operations.'
                "NULL":
                    $ref: '#/components/schemas/NullAttributeValue'
                    description: 'An attribute of type Null. For example: "NULL": true'
                S:
                    $ref: '#/components/schemas/StringAttributeValue'
                    description: 'An attribute of type String. For example: "S": "Hello"'
                SS:
                    $ref: '#/components/schemas/StringSetAttributeValue'
                    description: 'An attribute of type String Set. For example: "SS": ["Giraffe", "Hippo" ,"Zebra"]'
            type: object
        AttributeValueList:
            items:
                $ref: '#/components/schemas/AttributeValue'
            type: array
        AttributeValueUpdate:
            description: For the UpdateItem operation, represents the attributes to be modified, the action to perform on each, and the new value for each. You cannot use UpdateItem to update any primary key attributes. Instead, you will need to delete the item, and then use PutItem to create a new item with new attributes. Attribute values cannot be null; string and binary type attributes must have lengths greater than zero; and set type attributes must not be empty. Requests with empty values will be rejected with a ValidationException exception.
            properties:
                Action:
                    $ref: '#/components/schemas/AttributeAction'
                    description: 'Specifies how to perform the update. Valid values are PUT (default), DELETE , and ADD . The behavior depends on whether the specified primary key already exists in the table. If an item with the specified Key is found in the table: PUT - Adds the specified attribute to the item. If the attribute already exists, it is replaced by the new value. DELETE - If no value is specified, the attribute and its value are removed from the item. The data type of the specified value must match the existing value''s data type. If a set of values is specified, then those values are subtracted from the old set. For example, if the attribute value was the set [a,b,c] and the DELETE action specified [a,c] , then the final attribute value would be [b] . Specifying an empty set is an error. ADD - If the attribute does not already exist, then the attribute and its values are added to the item. If the attribute does exist, then the behavior of ADD depends on the data type of the attribute: If the existing attribute is a number, and if Value is also a number, then the Value is mathematically added to the existing attribute. If Value is a negative number, then it is subtracted from the existing attribute. If you use ADD to increment or decrement a number value for an item that doesn''t exist before the update, DynamoDB uses 0 as the initial value. In addition, if you use ADD to update an existing item, and intend to increment or decrement an attribute value which does not yet exist, DynamoDB uses 0 as the initial value. For example, suppose that the item you want to update does not yet have an attribute named itemcount , but you decide to ADD the number 3 to this attribute anyway, even though it currently does not exist. DynamoDB will create the itemcount attribute, set its initial value to 0 , and finally add 3 to it. The result will be a new itemcount attribute in the item, with a value of 3 . If the existing data type is a set, and if the Value is also a set, then the Value is added to the existing set. (This is a set operation, not mathematical addition.) For example, if the attribute value was the set [1,2] , and the ADD action specified [3] , then the final attribute value would be [1,2,3] . An error occurs if an Add action is specified for a set attribute and the attribute type specified does not match the existing set type. Both sets must have the same primitive data type. For example, if the existing data type is a set of strings, the Value must also be a set of strings. The same holds true for number sets and binary sets. This action is only valid for an existing attribute whose data type is number or is a set. Do not use ADD for any other data types. If no item with the specified Key is found: PUT - DynamoDB creates a new item with the specified primary key, and then adds the attribute. DELETE - Nothing happens; there is no attribute to delete. ADD - DynamoDB creates a new item with the supplied primary key and number (or set) for the attribute value. The only data types allowed are number, number set, string set or binary set.'
                Value:
                    $ref: '#/components/schemas/AttributeValue'
                    description: Represents the data for an attribute. Each attribute value is described as a name-value pair. The name is the data type, and the value is the data itself. For more information, see Data Types in the Amazon DynamoDB Developer Guide .
            type: object
        AutoScalingPolicyDescription:
            description: Represents the properties of the scaling policy.
            properties:
                PolicyName:
                    $ref: '#/components/schemas/AutoScalingPolicyName'
                    description: The name of the scaling policy.
                TargetTrackingScalingPolicyConfiguration:
                    $ref: '#/components/schemas/AutoScalingTargetTrackingScalingPolicyConfigurationDescription'
                    description: Represents a target tracking scaling policy configuration.
            type: object
        AutoScalingPolicyDescriptionList:
            items:
                $ref: '#/components/schemas/AutoScalingPolicyDescription'
            type: array
        AutoScalingPolicyName:
            maxLength: 256
            minLength: 1
            pattern: ^[\x20-\x7E]+$
            type: string
        AutoScalingPolicyUpdate:
            description: Represents the auto scaling policy to be modified.
            properties:
                PolicyName:
                    $ref: '#/components/schemas/AutoScalingPolicyName'
                    description: The name of the scaling policy.
                TargetTrackingScalingPolicyConfiguration:
                    $ref: '#/components/schemas/AutoScalingTargetTrackingScalingPolicyConfigurationUpdate'
                    description: Represents a target tracking scaling policy configuration.
            required:
                - TargetTrackingScalingPolicyConfiguration
            type: object
        AutoScalingRoleArn:
            maxLength: 1600
            minLength: 1
            type: string
            x-aws-pattern: ^[\u0020-\uD7FF\uE000-\uFFFD\uD800\uDC00-\uDBFF\uDFFF\r\n\t]*$
        AutoScalingSettingsDescription:
            description: Represents the auto scaling settings for a global table or global secondary index.
            properties:
                AutoScalingDisabled:
                    $ref: '#/components/schemas/BooleanObject'
                    description: Disabled auto scaling for this global table or global secondary index.
                AutoScalingRoleArn:
                    $ref: '#/components/schemas/String'
                    description: Role ARN used for configuring the auto scaling policy.
                MaximumUnits:
                    $ref: '#/components/schemas/PositiveLongObject'
                    description: The maximum capacity units that a global table or global secondary index should be scaled up to.
                MinimumUnits:
                    $ref: '#/components/schemas/PositiveLongObject'
                    description: The minimum capacity units that a global table or global secondary index should be scaled down to.
                ScalingPolicies:
                    $ref: '#/components/schemas/AutoScalingPolicyDescriptionList'
                    description: Information about the scaling policies.
            type: object
        AutoScalingSettingsUpdate:
            description: Represents the auto scaling settings to be modified for a global table or global secondary index.
            properties:
                AutoScalingDisabled:
                    $ref: '#/components/schemas/BooleanObject'
                    description: Disabled auto scaling for this global table or global secondary index.
                AutoScalingRoleArn:
                    $ref: '#/components/schemas/AutoScalingRoleArn'
                    description: Role ARN used for configuring auto scaling policy.
                MaximumUnits:
                    $ref: '#/components/schemas/PositiveLongObject'
                    description: The maximum capacity units that a global table or global secondary index should be scaled up to.
                MinimumUnits:
                    $ref: '#/components/schemas/PositiveLongObject'
                    description: The minimum capacity units that a global table or global secondary index should be scaled down to.
                ScalingPolicyUpdate:
                    $ref: '#/components/schemas/AutoScalingPolicyUpdate'
                    description: The scaling policy to apply for scaling target global table or global secondary index capacity units.
            type: object
        AutoScalingTargetTrackingScalingPolicyConfigurationDescription:
            description: Represents the properties of a target tracking scaling policy.
            properties:
                DisableScaleIn:
                    $ref: '#/components/schemas/BooleanObject'
                    description: Indicates whether scale in by the target tracking policy is disabled. If the value is true, scale in is disabled and the target tracking policy won't remove capacity from the scalable resource. Otherwise, scale in is enabled and the target tracking policy can remove capacity from the scalable resource. The default value is false.
                ScaleInCooldown:
                    $ref: '#/components/schemas/IntegerObject'
                    description: The amount of time, in seconds, after a scale in activity completes before another scale in activity can start. The cooldown period is used to block subsequent scale in requests until it has expired. You should scale in conservatively to protect your application's availability. However, if another alarm triggers a scale out policy during the cooldown period after a scale-in, application auto scaling scales out your scalable target immediately.
                ScaleOutCooldown:
                    $ref: '#/components/schemas/IntegerObject'
                    description: The amount of time, in seconds, after a scale out activity completes before another scale out activity can start. While the cooldown period is in effect, the capacity that has been added by the previous scale out event that initiated the cooldown is calculated as part of the desired capacity for the next scale out. You should continuously (but not excessively) scale out.
                TargetValue:
                    $ref: '#/components/schemas/DoubleObject'
                    description: The target value for the metric. The range is 8.515920e-109 to 1.174271e+108 (Base 10) or 2e-360 to 2e360 (Base 2).
            required:
                - TargetValue
            type: object
        AutoScalingTargetTrackingScalingPolicyConfigurationUpdate:
            description: Represents the settings of a target tracking scaling policy that will be modified.
            properties:
                DisableScaleIn:
                    $ref: '#/components/schemas/BooleanObject'
                    description: Indicates whether scale in by the target tracking policy is disabled. If the value is true, scale in is disabled and the target tracking policy won't remove capacity from the scalable resource. Otherwise, scale in is enabled and the target tracking policy can remove capacity from the scalable resource. The default value is false.
                ScaleInCooldown:
                    $ref: '#/components/schemas/IntegerObject'
                    description: The amount of time, in seconds, after a scale in activity completes before another scale in activity can start. The cooldown period is used to block subsequent scale in requests until it has expired. You should scale in conservatively to protect your application's availability. However, if another alarm triggers a scale out policy during the cooldown period after a scale-in, application auto scaling scales out your scalable target immediately.
                ScaleOutCooldown:
                    $ref: '#/components/schemas/IntegerObject'
                    description: The amount of time, in seconds, after a scale out activity completes before another scale out activity can start. While the cooldown period is in effect, the capacity that has been added by the previous scale out event that initiated the cooldown is calculated as part of the desired capacity for the next scale out. You should continuously (but not excessively) scale out.
                TargetValue:
                    $ref: '#/components/schemas/DoubleObject'
                    description: The target value for the metric. The range is 8.515920e-109 to 1.174271e+108 (Base 10) or 2e-360 to 2e360 (Base 2).
            required:
                - TargetValue
            type: object
        AwsJsonError:
            description: 'The body of every AWS JSON error reply: __type names the error.'
            properties:
                __type:
                    type: string
                Message:
                    type: string
                message:
                    type: string
            required:
                - __type
            type: object
        Backfilling:
            type: boolean
        BackupArn:
            maxLength: 1024
            minLength: 37
            type: string
        BackupCreationDateTime:
            type: number
        BackupDescription:
