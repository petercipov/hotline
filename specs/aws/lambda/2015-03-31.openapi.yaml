                Cors:
                    $ref: '#/components/schemas/Cors'
                    description: The cross-origin resource sharing (CORS) settings for your function URL.
                InvokeMode:
                    $ref: '#/components/schemas/InvokeMode'
                    description: 'Use one of the following options: BUFFERED – This is the default option. Lambda invokes your function using the Invoke API operation. Invocation results are available when the payload is complete. The maximum payload size is 6 MB. RESPONSE_STREAM – Your function streams payload results as they become available. Lambda invokes your function using the InvokeWithResponseStream API operation. The maximum response payload size is 200 MB.'
