                    description: 'The list of bootstrap servers for your Kafka brokers in the following format: "KAFKA_BOOTSTRAP_SERVERS": ["abc.xyz.com:xxxx","abc2.xyz.com:xxxx"] .'
            type: object
        SelfManagedKafkaEventSourceConfig:
            description: Specific configuration settings for a self-managed Apache Kafka event source.
            properties:
                ConsumerGroupId:
                    $ref: '#/components/schemas/URI'
                    description: The identifier for the Kafka consumer group to join. The consumer group ID must be unique among all your Kafka event sources. After creating a Kafka event source mapping with the consumer group ID specified, you cannot update this value. For more information, see Customizable consumer group ID .
                ConsumptionMode:
                    $ref: '#/components/schemas/KafkaEventSourceMappingConsumptionMode'
                    description: The mode that Lambda uses to consume records from your self-managed Apache Kafka topic. The default is Stream . Stream – Lambda consumes records using a Kafka consumer group and preserves the order of records within each partition. This is the default when you omit ConsumptionMode . Queue – Lambda consumes records using a Kafka share group. Multiple consumers can process records from the same partitions concurrently. Queue mode does not preserve per-partition order. Queue mode requires an Apache Kafka cluster running version 4.2 or later with share groups enabled. You cannot change ConsumptionMode after you create the event source mapping. To use a different consumption mode, create a new event source mapping. When ConsumptionMode is Queue , the StartingPosition , StartingPositionTimestamp , and MaximumBatchingWindowInSeconds parameters are not supported.
                SchemaRegistryConfig:
                    $ref: '#/components/schemas/KafkaSchemaRegistryConfig'
                    description: Specific configuration settings for a Kafka schema registry.
            type: object
