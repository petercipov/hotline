components:
    schemas:
        AccountLimit:
            description: Limits that are related to concurrency and storage. All file and storage sizes are in bytes.
            properties:
                CodeSizeUnzipped:
                    $ref: '#/components/schemas/Long'
                    description: The maximum size of a function's deployment package and layers when they're extracted.
                CodeSizeZipped:
                    $ref: '#/components/schemas/Long'
                    description: The maximum size of a deployment package when it's uploaded directly to Lambda. Use Amazon S3 for larger files.
                ConcurrentExecutions:
                    $ref: '#/components/schemas/Integer'
                    description: The maximum number of simultaneous function executions.
                TotalCodeSize:
                    $ref: '#/components/schemas/Long'
                    description: The amount of storage space that you can use for all deployment packages and layer archives.
                UnreservedConcurrentExecutions:
                    $ref: '#/components/schemas/UnreservedConcurrentExecutions'
                    description: The maximum number of simultaneous function executions, minus the capacity that's reserved for individual functions with PutFunctionConcurrency .
            type: object
        AccountUsage:
            description: The number of functions and amount of storage in use.
            properties:
                FunctionCount:
                    $ref: '#/components/schemas/Long'
                    description: The number of Lambda functions.
                TotalCodeSize:
                    $ref: '#/components/schemas/Long'
                    description: The amount of storage space, in bytes, that's being used by deployment packages and layer archives.
            type: object
        Action:
            maxLength: 10000
            minLength: 0
            pattern: ^(lambda:[*]|lambda:[a-zA-Z]+|[*])$
            type: string
        AddLayerVersionPermissionRequest:
            properties:
                Action:
                    $ref: '#/components/schemas/LayerPermissionAllowedAction'
                    description: The API action that grants access to the layer. For example, lambda:GetLayerVersion .
                OrganizationId:
                    $ref: '#/components/schemas/OrganizationId'
                    description: With the principal set to * , grant permission to all accounts in the specified organization.
                Principal:
                    $ref: '#/components/schemas/LayerPermissionAllowedPrincipal'
                    description: An account ID, or * to grant layer usage permission to all accounts in an organization, or all Amazon Web Services accounts (if organizationId is not specified). For the last case, make sure that you really do want all Amazon Web Services accounts to have usage permission to this layer.
                StatementId:
                    $ref: '#/components/schemas/StatementId'
                    description: An identifier that distinguishes the policy from others on the same layer version.
            required:
                - Action
                - Principal
                - StatementId
            type: object
        AddLayerVersionPermissionResponse:
            properties:
                RevisionId:
                    $ref: '#/components/schemas/String'
                    description: A unique identifier for the current revision of the policy.
                Statement:
                    $ref: '#/components/schemas/String'
                    description: The permission statement.
            type: object
        AddPermissionRequest:
            properties:
                Action:
                    $ref: '#/components/schemas/Action'
                    description: The action that the principal can use on the function. For example, lambda:InvokeFunction or lambda:GetFunction .
                EventSourceToken:
                    $ref: '#/components/schemas/EventSourceToken'
                    description: For Alexa Smart Home functions, a token that the invoker must supply.
                FunctionUrlAuthType:
                    $ref: '#/components/schemas/FunctionUrlAuthType'
                    description: The type of authentication that your function URL uses. Set to AWS_IAM if you want to restrict access to authenticated users only. Set to NONE if you want to bypass IAM authentication to create a public endpoint. For more information, see Control access to Lambda function URLs .
                InvokedViaFunctionUrl:
                    $ref: '#/components/schemas/InvokedViaFunctionUrl'
                    description: Indicates whether the permission applies when the function is invoked through a function URL.
                Principal:
                    $ref: '#/components/schemas/Principal'
                    description: The Amazon Web Services service, Amazon Web Services account, IAM user, or IAM role that invokes the function. If you specify a service, use SourceArn or SourceAccount to limit who can invoke the function through that service.
                PrincipalOrgID:
                    $ref: '#/components/schemas/PrincipalOrgID'
                    description: The identifier for your organization in Organizations. Use this to grant permissions to all the Amazon Web Services accounts under this organization.
                RevisionId:
                    $ref: '#/components/schemas/String'
                    description: Update the policy only if the revision ID matches the ID that's specified. Use this option to avoid modifying a policy that has changed since you last read it.
                SourceAccount:
                    $ref: '#/components/schemas/SourceOwner'
                    description: For Amazon Web Services service, the ID of the Amazon Web Services account that owns the resource. Use this together with SourceArn to ensure that the specified account owns the resource. It is possible for an Amazon S3 bucket to be deleted by its owner and recreated by another account.
                SourceArn:
                    $ref: '#/components/schemas/Arn'
                    description: For Amazon Web Services services, the ARN of the Amazon Web Services resource that invokes the function. For example, an Amazon S3 bucket or Amazon SNS topic. Note that Lambda configures the comparison using the StringLike operator.
                StatementId:
                    $ref: '#/components/schemas/StatementId'
                    description: A statement identifier that differentiates the statement from others in the same policy.
            required:
                - Action
                - Principal
                - StatementId
            type: object
        AddPermissionResponse:
            properties:
                Statement:
                    $ref: '#/components/schemas/String'
                    description: The permission statement that's added to the function policy.
            type: object
        AdditionalVersionWeights:
            additionalProperties:
                $ref: '#/components/schemas/Weight'
            type: object
        Alias:
            maxLength: 128
            minLength: 1
            type: string
            x-aws-pattern: ^(?!^[0-9]+$)([a-zA-Z0-9-_]+)$
        AliasConfiguration:
            properties:
                AliasArn:
                    $ref: '#/components/schemas/FunctionArn'
                    description: The Amazon Resource Name (ARN) of the alias.
                Description:
                    $ref: '#/components/schemas/Description'
                    description: A description of the alias.
                FunctionVersion:
                    $ref: '#/components/schemas/Version'
                    description: The function version that the alias invokes.
                Name:
                    $ref: '#/components/schemas/Alias'
                    description: The name of the alias.
                RevisionId:
                    $ref: '#/components/schemas/String'
                    description: A unique identifier that changes when you update the alias.
                RoutingConfig:
                    $ref: '#/components/schemas/AliasRoutingConfiguration'
                    description: The routing configuration of the alias.
            type: object
        AliasList:
            items:
                $ref: '#/components/schemas/AliasConfiguration'
            type: array
        AliasRoutingConfiguration:
            description: The traffic-shifting configuration of a Lambda function alias.
            properties:
                AdditionalVersionWeights:
                    $ref: '#/components/schemas/AdditionalVersionWeights'
                    description: The second version, and the percentage of traffic that's routed to it.
            type: object
        AllowCredentials:
            type: boolean
        AllowMethodsList:
            items:
                $ref: '#/components/schemas/Method'
            maxItems: 6
            minItems: 0
            type: array
        AllowOriginsList:
            items:
                $ref: '#/components/schemas/Origin'
            maxItems: 100
            minItems: 0
            type: array
        AllowedPublishers:
            description: List of signing profiles that can sign a code package.
            properties:
                SigningProfileVersionArns:
                    $ref: '#/components/schemas/SigningProfileVersionArns'
                    description: The Amazon Resource Name (ARN) for each of the signing profiles. A signing profile defines a trusted user who can sign a code package.
            required:
                - SigningProfileVersionArns
            type: object
        AmazonManagedKafkaEventSourceConfig:
            description: Specific configuration settings for an Amazon Managed Streaming for Apache Kafka (Amazon MSK) event source.
            properties:
                ConsumerGroupId:
                    $ref: '#/components/schemas/URI'
                    description: The identifier for the Kafka consumer group to join. The consumer group ID must be unique among all your Kafka event sources. After creating a Kafka event source mapping with the consumer group ID specified, you cannot update this value. For more information, see Customizable consumer group ID .
                SchemaRegistryConfig:
                    $ref: '#/components/schemas/KafkaSchemaRegistryConfig'
                    description: Specific configuration settings for a Kafka schema registry.
            type: object
        ApplicationLogLevel:
            enum:
                - DEBUG
                - ERROR
                - FATAL
                - INFO
                - TRACE
