                    description: The ARN of the layer version.
                LicenseInfo:
                    $ref: '#/components/schemas/LicenseInfo'
                    description: The layer's software license.
                Version:
                    $ref: '#/components/schemas/LayerVersionNumber'
                    description: The version number.
            type: object
        PublishVersionRequest:
            properties:
                CodeSha256:
                    $ref: '#/components/schemas/String'
                    description: Only publish a version if the hash value matches the value that's specified. Use this option to avoid publishing a version if the function code has changed since you last updated it. You can get the hash for the version that you uploaded from the output of UpdateFunctionCode .
                Description:
                    $ref: '#/components/schemas/Description'
                    description: A description for the version to override the description in the function configuration.
                PublishTo:
                    $ref: '#/components/schemas/FunctionVersionLatestPublished'
                    description: Specifies where to publish the function version or configuration.
                RevisionId:
                    $ref: '#/components/schemas/String'
                    description: Only update the function if the revision ID matches the ID that's specified. Use this option to avoid publishing a version if the function configuration has changed since you last updated it.
            type: object
        PutFunctionCodeSigningConfigRequest:
            properties:
                CodeSigningConfigArn:
                    $ref: '#/components/schemas/CodeSigningConfigArn'
                    description: The The Amazon Resource Name (ARN) of the code signing configuration.
            required:
                - CodeSigningConfigArn
            type: object
        PutFunctionCodeSigningConfigResponse:
            properties:
                CodeSigningConfigArn:
                    $ref: '#/components/schemas/CodeSigningConfigArn'
                    description: The The Amazon Resource Name (ARN) of the code signing configuration.
                FunctionName:
                    $ref: '#/components/schemas/FunctionName'
                    description: The name or ARN of the Lambda function. Name formats Function name - MyFunction . Function ARN - arn:aws:lambda:us-west-2:123456789012:function:MyFunction . Partial ARN - 123456789012:function:MyFunction . The length constraint applies only to the full ARN. If you specify only the function name, it is limited to 64 characters in length.
            required:
                - CodeSigningConfigArn
                - FunctionName
            type: object
        PutFunctionConcurrencyRequest:
            properties:
                ReservedConcurrentExecutions:
                    $ref: '#/components/schemas/ReservedConcurrentExecutions'
                    description: The number of simultaneous executions to reserve for the function.
            required:
                - ReservedConcurrentExecutions
            type: object
        PutFunctionEventInvokeConfigRequest:
            properties:
                DestinationConfig:
                    $ref: '#/components/schemas/DestinationConfig'
                    description: A destination for events after they have been sent to a function for processing. Destinations Function - The Amazon Resource Name (ARN) of a Lambda function. Queue - The ARN of a standard SQS queue. Bucket - The ARN of an Amazon S3 bucket. Topic - The ARN of a standard SNS topic. Event Bus - The ARN of an Amazon EventBridge event bus. S3 buckets are supported only for on-failure destinations. To retain records of successful invocations, use another destination type.
                MaximumEventAgeInSeconds:
                    $ref: '#/components/schemas/MaximumEventAgeInSeconds'
                    description: The maximum age of a request that Lambda sends to a function for processing.
                MaximumRetryAttempts:
                    $ref: '#/components/schemas/MaximumRetryAttempts'
                    description: The maximum number of times to retry when the function returns an error.
            type: object
        PutFunctionRecursionConfigRequest:
            properties:
                RecursiveLoop:
                    $ref: '#/components/schemas/RecursiveLoop'
                    description: If you set your function's recursive loop detection configuration to Allow , Lambda doesn't take any action when it detects your function being invoked as part of a recursive loop. We recommend that you only use this setting if your design intentionally uses a Lambda function to write data back to the same Amazon Web Services resource that invokes it. If you set your function's recursive loop detection configuration to Terminate , Lambda stops your function being invoked and notifies you when it detects your function being invoked as part of a recursive loop. By default, Lambda sets your function's configuration to Terminate . If your design intentionally uses a Lambda function to write data back to the same Amazon Web Services resource that invokes the function, then use caution and implement suitable guard rails to prevent unexpected charges being billed to your Amazon Web Services account. To learn more about best practices for using recursive invocation patterns, see Recursive patterns that cause run-away Lambda functions in Serverless Land.
            required:
                - RecursiveLoop
            type: object
        PutFunctionRecursionConfigResponse:
            properties:
                RecursiveLoop:
                    $ref: '#/components/schemas/RecursiveLoop'
                    description: The status of your function's recursive loop detection configuration. When this value is set to Allow and Lambda detects your function being invoked as part of a recursive loop, it doesn't take any action. When this value is set to Terminate and Lambda detects your function being invoked as part of a recursive loop, it stops your function being invoked and notifies you.
            type: object
        PutFunctionScalingConfigRequest:
            properties:
                FunctionScalingConfig:
                    $ref: '#/components/schemas/FunctionScalingConfig'
                    description: The scaling configuration to apply to the function, including minimum and maximum execution environment limits.
            type: object
        PutFunctionScalingConfigResponse:
            properties:
                FunctionState:
                    $ref: '#/components/schemas/State'
                    description: The current state of the function after applying the scaling configuration.
            type: object
        PutProvisionedConcurrencyConfigRequest:
            properties:
                ProvisionedConcurrentExecutions:
                    $ref: '#/components/schemas/PositiveInteger'
                    description: The amount of provisioned concurrency to allocate for the version or alias.
            required:
                - ProvisionedConcurrentExecutions
            type: object
        PutProvisionedConcurrencyConfigResponse:
            properties:
                AllocatedProvisionedConcurrentExecutions:
                    $ref: '#/components/schemas/NonNegativeInteger'
                    description: The amount of provisioned concurrency allocated. When a weighted alias is used during linear and canary deployments, this value fluctuates depending on the amount of concurrency that is provisioned for the function versions.
                AvailableProvisionedConcurrentExecutions:
                    $ref: '#/components/schemas/NonNegativeInteger'
                    description: The amount of provisioned concurrency available.
                LastModified:
                    $ref: '#/components/schemas/Timestamp'
                    description: The date and time that a user last updated the configuration, in ISO 8601 format .
                RequestedProvisionedConcurrentExecutions:
                    $ref: '#/components/schemas/PositiveInteger'
                    description: The amount of provisioned concurrency requested.
                Status:
                    $ref: '#/components/schemas/ProvisionedConcurrencyStatusEnum'
                    description: The status of the allocation process.
                StatusReason:
                    $ref: '#/components/schemas/String'
                    description: For failed allocations, the reason that provisioned concurrency could not be allocated.
            type: object
        PutResourcePolicyRequest:
            properties:
                Policy:
                    $ref: '#/components/schemas/ResourcePolicy'
                    description: The policy document you want to add to your Lambda resource. This is formatted as a JSON string. For more information, see Working with resource-based policies in Lambda in the Lambda Developer Guide .
                RevisionId:
                    $ref: '#/components/schemas/RevisionId'
                    description: The revision ID that the existing policy must match for the replacement to proceed. If the revision ID doesn't match, the operation fails with a PreconditionFailedException error. To retrieve the current revision ID, use the GetResourcePolicy operation.
            required:
                - Policy
            type: object
        PutResourcePolicyResponse:
            properties:
                Policy:
                    $ref: '#/components/schemas/ResourcePolicy'
                    description: The resource-based policy that Lambda adds to the resource.
                RevisionId:
                    $ref: '#/components/schemas/RevisionId'
                    description: The revision ID of the policy that Lambda adds to your Lambda resource.
            type: object
        PutRuntimeManagementConfigRequest:
            properties:
                RuntimeVersionArn:
                    $ref: '#/components/schemas/RuntimeVersionArn'
                    description: The ARN of the runtime version you want the function to use. This is only required if you're using the Manual runtime update mode.
                UpdateRuntimeOn:
                    $ref: '#/components/schemas/UpdateRuntimeOn'
                    description: Specify the runtime update mode. Auto (default) - Automatically update to the most recent and secure runtime version using a Two-phase runtime version rollout . This is the best choice for most customers to ensure they always benefit from runtime updates. Function update - Lambda updates the runtime of your function to the most recent and secure runtime version when you update your function. This approach synchronizes runtime updates with function deployments, giving you control over when runtime updates are applied and allowing you to detect and mitigate rare runtime update incompatibilities early. When using this setting, you need to regularly update your functions to keep their runtime up-to-date. Manual - You specify a runtime version in your function configuration. The function will use this runtime version indefinitely. In the rare case where a new runtime version is incompatible with an existing function, this allows you to roll back your function to an earlier runtime version. For more information, see Roll back a runtime version .
            required:
                - UpdateRuntimeOn
            type: object
        PutRuntimeManagementConfigResponse:
            properties:
                FunctionArn:
                    $ref: '#/components/schemas/FunctionArn'
                    description: The ARN of the function
                RuntimeVersionArn:
                    $ref: '#/components/schemas/RuntimeVersionArn'
                    description: The ARN of the runtime the function is configured to use. If the runtime update mode is manual , the ARN is returned, otherwise null is returned.
                UpdateRuntimeOn:
                    $ref: '#/components/schemas/UpdateRuntimeOn'
                    description: The runtime update mode.
            required:
                - FunctionArn
                - UpdateRuntimeOn
            type: object
