        UpdateEventSourceMappingRequest:
            properties:
                AmazonManagedKafkaEventSourceConfig:
                    $ref: '#/components/schemas/AmazonManagedKafkaEventSourceConfig'
                BatchSize:
                    $ref: '#/components/schemas/BatchSize'
                    description: The maximum number of records in each batch that Lambda pulls from your stream or queue and sends to your function. Lambda passes all of the records in the batch to the function in a single call, up to the payload limit for synchronous invocation (6 MB). Amazon Kinesis – Default 100. Max 10,000. Amazon DynamoDB Streams – Default 100. Max 10,000. Amazon Simple Queue Service – Default 10. For standard queues the max is 10,000. For FIFO queues the max is 10. Amazon Managed Streaming for Apache Kafka – Default 100. Max 10,000. Self-managed Apache Kafka – Default 100. Max 10,000. Amazon MQ (ActiveMQ and RabbitMQ) – Default 100. Max 10,000. DocumentDB – Default 100. Max 10,000.
                BisectBatchOnFunctionError:
                    $ref: '#/components/schemas/BisectBatchOnFunctionError'
                    description: (Kinesis, DynamoDB Streams, Amazon MSK, and self-managed Apache Kafka) If the function returns an error, split the batch in two and retry.
                DestinationConfig:
                    $ref: '#/components/schemas/DestinationConfig'
                    description: (Kinesis, DynamoDB Streams, Amazon MSK, and self-managed Apache Kafka) A configuration object that specifies the destination of an event after Lambda processes it.
                DocumentDBEventSourceConfig:
                    $ref: '#/components/schemas/DocumentDBEventSourceConfig'
                    description: Specific configuration settings for a DocumentDB event source.
                Enabled:
                    $ref: '#/components/schemas/Enabled'
                    description: 'When true, the event source mapping is active. When false, Lambda pauses polling and invocation. Default: True'
                FilterCriteria:
                    $ref: '#/components/schemas/FilterCriteria'
                    description: An object that defines the filter criteria that determine whether Lambda should process an event. For more information, see Lambda event filtering .
                FunctionName:
                    $ref: '#/components/schemas/NamespacedFunctionName'
                    description: The name or ARN of the Lambda function. Name formats Function name – MyFunction . Function ARN – arn:aws:lambda:us-west-2:123456789012:function:MyFunction . Version or Alias ARN – arn:aws:lambda:us-west-2:123456789012:function:MyFunction:PROD . Partial ARN – 123456789012:function:MyFunction . The length constraint applies only to the full ARN. If you specify only the function name, it's limited to 64 characters in length.
                FunctionResponseTypes:
                    $ref: '#/components/schemas/FunctionResponseTypeList'
                    description: (Kinesis, DynamoDB Streams, Amazon MSK, self-managed Apache Kafka, and Amazon SQS) A list of current response type enums applied to the event source mapping.
                KMSKeyArn:
                    $ref: '#/components/schemas/KMSKeyArn'
                    description: The ARN of the Key Management Service (KMS) customer managed key that Lambda uses to encrypt your function's filter criteria . By default, Lambda does not encrypt your filter criteria object. Specify this property to encrypt data using your own customer managed key.
                LoggingConfig:
                    $ref: '#/components/schemas/EventSourceMappingLoggingConfig'
                MaximumBatchingWindowInSeconds:
                    $ref: '#/components/schemas/MaximumBatchingWindowInSeconds'
                    description: 'The maximum amount of time, in seconds, that Lambda spends gathering records before invoking the function. You can configure MaximumBatchingWindowInSeconds to any value from 0 seconds to 300 seconds in increments of seconds. For Kinesis, DynamoDB, and Amazon SQS event sources, the default batching window is 0 seconds. For Amazon MSK, Self-managed Apache Kafka, Amazon MQ, and DocumentDB event sources, the default batching window is 500 ms. Note that because you can only change MaximumBatchingWindowInSeconds in increments of seconds, you cannot revert back to the 500 ms default batching window after you have changed it. To restore the default batching window, you must create a new event source mapping. Related setting: For Kinesis, DynamoDB, and Amazon SQS event sources, when you set BatchSize to a value greater than 10, you must set MaximumBatchingWindowInSeconds to at least 1. Not supported for Kafka event source mappings when ConsumptionMode is Queue .'
                MaximumRecordAgeInSeconds:
                    $ref: '#/components/schemas/MaximumRecordAgeInSeconds'
                    description: (Kinesis, DynamoDB Streams, Amazon MSK, and self-managed Apache Kafka) Discard records older than the specified age. The default value is infinite (-1).
                MaximumRetryAttempts:
                    $ref: '#/components/schemas/MaximumRetryAttemptsEventSourceMapping'
                    description: (Kinesis, DynamoDB Streams, Amazon MSK, and self-managed Apache Kafka) Discard records after the specified number of retries. The default value is infinite (-1). When set to infinite (-1), failed records are retried until the record expires. For Kafka Stream consumption mode, the default is -1 (infinite retries; capped at 10 when an on-failure destination is configured). For Kafka Queue consumption mode, the default is 0 , and if no on-failure destination is configured the Kafka broker performs retries.
                MetricsConfig:
                    $ref: '#/components/schemas/EventSourceMappingMetricsConfig'
                    description: The metrics configuration for your event source. For more information, see Event source mapping metrics .
                ParallelizationFactor:
                    $ref: '#/components/schemas/ParallelizationFactor'
                    description: (Kinesis and DynamoDB Streams only) The number of batches to process from each shard concurrently.
                ProvisionedPollerConfig:
                    $ref: '#/components/schemas/ProvisionedPollerConfig'
                    description: (Amazon SQS, Amazon MSK, and self-managed Apache Kafka only) The provisioned mode configuration for the event source. For more information, see provisioned mode .
                ScalingConfig:
                    $ref: '#/components/schemas/ScalingConfig'
                    description: (Amazon SQS only) The scaling configuration for the event source. For more information, see Configuring maximum concurrency for Amazon SQS event sources .
                SelfManagedKafkaEventSourceConfig:
                    $ref: '#/components/schemas/SelfManagedKafkaEventSourceConfig'
                SourceAccessConfigurations:
                    $ref: '#/components/schemas/SourceAccessConfigurations'
                    description: An array of authentication protocols or VPC components required to secure your event source.
                TumblingWindowInSeconds:
                    $ref: '#/components/schemas/TumblingWindowInSeconds'
                    description: (Kinesis and DynamoDB Streams only) The duration in seconds of a processing window for DynamoDB and Kinesis Streams event sources. A value of 0 seconds indicates no tumbling window.
            type: object
        UpdateFunctionCodeRequest:
            properties:
                Architectures:
                    $ref: '#/components/schemas/ArchitecturesList'
                    description: The instruction set architecture that the function supports. Enter a string array with one of the valid values (arm64 or x86_64). The default value is x86_64 .
                DryRun:
                    $ref: '#/components/schemas/Boolean'
                    description: Set to true to validate the request parameters and access permissions without modifying the function code.
                ImageUri:
                    $ref: '#/components/schemas/String'
                    description: URI of a container image in the Amazon ECR registry. Do not use for a function defined with a .zip file archive.
                Publish:
                    $ref: '#/components/schemas/Boolean'
                    description: Set to true to publish a new version of the function after updating the code. This has the same effect as calling PublishVersion separately.
                PublishTo:
                    $ref: '#/components/schemas/FunctionVersionLatestPublished'
                    description: Specifies where to publish the function version or configuration.
                RevisionId:
                    $ref: '#/components/schemas/String'
                    description: Update the function only if the revision ID matches the ID that's specified. Use this option to avoid modifying a function that has changed since you last read it.
                S3Bucket:
                    $ref: '#/components/schemas/S3Bucket'
                    description: An Amazon S3 bucket in the same Amazon Web Services Region as your function. The bucket can be in a different Amazon Web Services account. Use only with a function defined with a .zip file archive deployment package.
                S3Key:
                    $ref: '#/components/schemas/S3Key'
                    description: The Amazon S3 key of the deployment package. Use only with a function defined with a .zip file archive deployment package.
                S3ObjectStorageMode:
                    $ref: '#/components/schemas/S3ObjectStorageMode'
                    description: 'Specifies how the deployment package is stored. Valid values: COPY (default) – Uploads a copy of your deployment package to Lambda. REFERENCE – Lambda references the deployment package from the specified Amazon S3 bucket.'
                S3ObjectVersion:
                    $ref: '#/components/schemas/S3ObjectVersion'
                    description: For versioned objects, the version of the deployment package object to use.
                SourceKMSKeyArn:
                    $ref: '#/components/schemas/KMSKeyArn'
                    description: The ARN of the Key Management Service (KMS) customer managed key that's used to encrypt your function's .zip deployment package. If you don't provide a customer managed key, Lambda uses an Amazon Web Services managed key.
                ZipFile:
                    $ref: '#/components/schemas/Blob'
                    description: The base64-encoded contents of the deployment package. Amazon Web Services SDK and CLI clients handle the encoding for you. Use only with a function defined with a .zip file archive deployment package.
            type: object
        UpdateFunctionConfigurationRequest:
            properties:
                CapacityProviderConfig:
                    $ref: '#/components/schemas/CapacityProviderConfig'
                    description: Configuration for the capacity provider that manages compute resources for Lambda functions.
                DeadLetterConfig:
                    $ref: '#/components/schemas/DeadLetterConfig'
                    description: A dead-letter queue configuration that specifies the queue or topic where Lambda sends asynchronous events when they fail processing. For more information, see Dead-letter queues .
                Description:
                    $ref: '#/components/schemas/Description'
                    description: A description of the function.
                DurableConfig:
                    $ref: '#/components/schemas/DurableConfig'
                    description: Configuration settings for durable functions , including execution timeout, retention period for execution history, and an optional ARN of the Key Management Service (KMS) customer managed key that is used to encrypt your durable execution's payload data, including input, output, and error payloads.
                Environment:
                    $ref: '#/components/schemas/Environment'
                    description: Environment variables that are accessible from function code during execution.
                EphemeralStorage:
                    $ref: '#/components/schemas/EphemeralStorage'
                    description: The size of the function's /tmp directory in MB. The default value is 512, but can be any whole number between 512 and 10,240 MB. For more information, see Configuring ephemeral storage (console) .
                FileSystemConfigs:
                    $ref: '#/components/schemas/FileSystemConfigList'
                    description: Connection settings for an Amazon EFS file system or an Amazon S3 Files file system.
                Handler:
                    $ref: '#/components/schemas/Handler'
                    description: The name of the method within your code that Lambda calls to run your function. Handler is required if the deployment package is a .zip file archive. The format includes the file name. It can also include namespaces and other qualifiers, depending on the runtime. For more information, see Lambda programming model .
                ImageConfig:
                    $ref: '#/components/schemas/ImageConfig'
                    description: Container image configuration values that override the values in the container image Docker file.
                KMSKeyArn:
                    $ref: '#/components/schemas/KMSKeyArn'
                    description: 'The ARN of the Key Management Service (KMS) customer managed key that''s used to encrypt the following resources: The function''s environment variables . The function''s Lambda SnapStart snapshots. When used with SourceKMSKeyArn , the unzipped version of the .zip deployment package that''s used for function invocations. For more information, see Specifying a customer managed key for Lambda . The optimized version of the container image that''s used for function invocations. Note that this is not the same key that''s used to protect your container image in the Amazon Elastic Container Registry (Amazon ECR). For more information, see Function lifecycle . If you don''t provide a customer managed key, Lambda uses an Amazon Web Services owned key or an Amazon Web Services managed key .'
                Layers:
                    $ref: '#/components/schemas/LayerList'
                    description: A list of function layers to add to the function's execution environment. Specify each layer by its ARN, including the version.
                LoggingConfig:
                    $ref: '#/components/schemas/LoggingConfig'
                    description: The function's Amazon CloudWatch Logs configuration settings.
                MemorySize:
                    $ref: '#/components/schemas/MemorySize'
                    description: The amount of memory available to the function at runtime. Increasing the function memory also increases its CPU allocation. The default value is 128 MB. The value can be any multiple of 1 MB.
                RevisionId:
                    $ref: '#/components/schemas/String'
                    description: Update the function only if the revision ID matches the ID that's specified. Use this option to avoid modifying a function that has changed since you last read it.
                Role:
                    $ref: '#/components/schemas/RoleArn'
                    description: The Amazon Resource Name (ARN) of the function's execution role.
                Runtime:
                    $ref: '#/components/schemas/Runtime'
                    description: The identifier of the function's runtime . Runtime is required if the deployment package is a .zip file archive. Specifying a runtime results in an error if you're deploying a function using a container image. The following list includes deprecated runtimes. Lambda blocks creating new functions and updating existing functions shortly after each runtime is deprecated. For more information, see Runtime use after deprecation . For a list of all currently supported runtimes, see Supported runtimes .
                SnapStart:
                    $ref: '#/components/schemas/SnapStart'
                    description: The function's SnapStart setting.
                Timeout:
                    $ref: '#/components/schemas/Timeout'
                    description: The amount of time (in seconds) that Lambda allows a function to run before stopping it. The default is 3 seconds, and the maximum allowed value is 900 seconds. For functions using Lambda Managed Instances, asynchronous invocations and event source mapping invocations (except Amazon MQ and Amazon DocumentDB) support a maximum allowed value of 5,400 seconds (90 minutes). For more information, see Lambda execution environment .
                TracingConfig:
                    $ref: '#/components/schemas/TracingConfig'
                    description: Set Mode to Active to sample and trace a subset of incoming requests with X-Ray .
                VpcConfig:
                    $ref: '#/components/schemas/VpcConfig'
                    description: For network connectivity to Amazon Web Services resources in a VPC, specify a list of security groups and subnets in the VPC. When you connect a function to a VPC, it can access resources and the internet only through that VPC. For more information, see Configuring a Lambda function to access resources in a VPC .
            type: object
        UpdateFunctionEventInvokeConfigRequest:
