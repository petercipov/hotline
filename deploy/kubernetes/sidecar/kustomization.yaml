# The Hotline proxy as a sidecar: kubectl apply -k deploy/kubernetes/sidecar
# Needs the key first:
#   kubectl create secret generic hotline-proxy-keys --from-file=fingerprint.key=./fingerprint.key
resources:
  - deployment.yaml
configMapGenerator:
  # The config and its overlays in one ConfigMap, so they change in one step.
  - name: hotline-proxy-config
    files:
      - hotline-proxy.yaml
    options:
      # Keep the name fixed: the proxy picks up a changed ConfigMap by
      # itself within 5 seconds, with no restart.
      disableNameSuffixHash: true
