# Builds the hotline-proxy image for linux/amd64 and linux/arm64, checks it,
# and on main and on release tags publishes it to GitHub's registry, with an
# SBOM, build provenance and a cosign signature (Peter, 2026-11-01). Detail:
# docs/proxy-docker-image.md.
name: image
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/petercipov/hotline-proxy

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # cosign keyless signing
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # A release tag v1.2.3 gives 1.2.3, 1.2 and latest; main gives edge;
      # every build gives sha-<short commit>.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha,prefix=sha-,format=short

      # The version hotline-proxy version prints: the git tag on a release,
      # else the commit.
      - id: version
        run: echo "version=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}" >> "$GITHUB_OUTPUT"

      # Smoke test on this machine's platform before anything is pushed.
      - name: build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/hotline-proxy/Dockerfile
          build-args: VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64
          load: true
          tags: hotline-proxy:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test
        run: |
          set -eu
          keys=$(mktemp -d)
          head -c 32 /dev/urandom > "$keys/fingerprint.key"
          chmod 755 "$keys" && chmod 644 "$keys/fingerprint.key"
          config="$PWD/deploy/kubernetes/sidecar"
          mounts="-v $config:/etc/hotline/config:ro -v $keys:/etc/hotline/keys:ro"

          test "$(docker run --rm hotline-proxy:smoke version)" = "hotline-proxy ${{ steps.version.outputs.version }}"
          docker run --rm --read-only $mounts hotline-proxy:smoke validate --config /etc/hotline/config/hotline-proxy.yaml

          # Runs as nonroot on a read-only filesystem, and says it is ready.
          docker run -d --name proxy --read-only --cap-drop ALL -p 8081:8081 $mounts hotline-proxy:smoke
          for i in $(seq 1 30); do
            curl -fs http://localhost:8081/readyz && break
            sleep 1
          done
          curl -fs http://localhost:8081/readyz
          test "$(docker inspect proxy --format '{{.Config.User}}')" = "65532:65532"
          docker rm -f proxy

      - name: log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both platforms; pushed only from main and release tags. Pull
      # requests build both, so a break shows before the merge.
      - id: build
        name: build both platforms
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/hotline-proxy/Dockerfile
          build-args: VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keyless: the signature names this workflow, with no key to keep.
      - uses: sigstore/cosign-installer@v4
        if: github.event_name == 'push'
      - name: sign
        if: github.event_name == 'push'
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
